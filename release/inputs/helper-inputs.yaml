{
  "schema": 1,
  "recipe": "release/build-platform-helpers.sh",
  "dependencies": ["guest-runtime", "orchestrator", "accelerator", "connector", "sandboxer"],
  "helpers": [
    {
      "name": "zot",
      "env": "ZOT_BIN",
      "cases": [
        "orchestrator.*.sh",
        "builder.*.sh",
        "telemetry.backends.sh",
        "telemetry.guest.sh",
        "telemetry.proxy.sh",
        "sandbox.*.sh",
        "snapshot.*.sh",
        "network.tapfd.sh",
        "image.manifest-boot.sh",
        "image.sandbox-assembly.sh",
        "telemetry.usage.sh",
        "telemetry.usage-faults.sh",
        "telemetry.source-faults.sh",
        "basic.demo.sh",
        "image.flatten.sh",
        "image.registry.sh"
      ]
    },
    {
      "name": "versitygw",
      "env": "VGW_BIN",
      "cases": [
        "orchestrator.*.sh",
        "builder.*.sh",
        "telemetry.backends.sh",
        "telemetry.guest.sh",
        "telemetry.proxy.sh",
        "basic.demo.sh"
      ]
    },
    {
      "name": "node-infra-guest",
      "env": "NODE_INFRA_GUEST_BIN",
      "cases": ["basic.node-infra-*.sh"]
    },
    {
      "name": "node-infra-xproxy",
      "env": "NODE_INFRA_XPROXY_BIN",
      "cases": ["basic.node-infra-config.sh", "basic.node-infra-docker.sh"]
    },
    {
      "name": "node-infra-xconductor",
      "env": "NODE_INFRA_XCONDUCTOR_BIN",
      "cases": ["basic.node-infra-config.sh", "basic.node-infra-docker.sh"]
    }
  ]
}
