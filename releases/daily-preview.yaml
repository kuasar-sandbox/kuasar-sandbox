    - feat: require node permits for coordinated cache reclaim ([#460](https://github.com/kuasar-sandbox/sandboxer/pull/460), [commit 10bc6a2f9e96](https://github.com/kuasar-sandbox/sandboxer/commit/10bc6a2f9e96bfb00634250385e8864dadb0c071)).
    - feat(storage): unify diff templates and generate deterministic ext4 ([#464](https://github.com/kuasar-sandbox/sandboxer/pull/464), [commit 38f8e00278e2](https://github.com/kuasar-sandbox/sandboxer/commit/38f8e00278e23653fac68a6825cebe526635b324)).
    - feat: add shared and per-disk diffstore QoS ([#462](https://github.com/kuasar-sandbox/sandboxer/pull/462), [commit f48e4c52c0ae](https://github.com/kuasar-sandbox/sandboxer/commit/f48e4c52c0aeaa2c1e0cfdc9b19fa903993d42eb)).
