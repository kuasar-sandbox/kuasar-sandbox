    # Kuasar Sandbox release-v0.1.13-preview.20261105

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.1.12`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.13-preview.20261105/releases/daily-preview.yaml).

    ## Component versions

    | Release unit | Version |
    |---|---|
    | `accelerator` | `v0.1.11` |
    | `connector` | `v0.1.7` |
    | `sandboxer` | `v0.1.13` |
    | `orchestrator` | `v0.1.12` |
