    # Kuasar Sandbox release-v0.2.0-preview.20261110

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.1.13`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261110/releases/daily-preview.yaml).

    ## Preview line initialization

    This first Preview opens the v0.2.0 development line from [release-v0.1.13](https://github.com/kuasar-sandbox/kuasar-sandbox/releases/tag/release-v0.1.13). All six selected component versions are unchanged from that Stable baseline. This Preview adds the node-infra platform changes below while retaining the `node-infra-v1` asset layout. Changes delivered in v0.1.13 remain documented in that release.

    ## Platform updates

    ### Node-infra host networking and optional transit

    [PR #379](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/379) ([commit 3276a3852d6e](https://github.com/kuasar-sandbox/kuasar-sandbox/commit/3276a3852d6e172b6617e92b152149e9622091fc)) changes the platform image, deployment tool and templates:

    - The delivered Quadlet now defaults to `Network=host`, and the default Connector configuration omits transit. The default deployment no longer requires a pre-created primary namespace or an ingress interface with a fixed name. Explicit `Network=ns:/absolute/path` remains available; either network mode can be used with or without a transit device.
    - Deployment verifies the selected network namespace and management peer ownership, and preflight rejects conflicting management interfaces, addresses/routes and native TCP listeners. Recovery uses the retained namespace and recorded image/configuration, including deployments without transit and existing recovery records.
    - English and Chinese deployment guides and examples now cover the default host setup and the optional namespace/transit choices.

    With transit omitted, Proxy ingress, guest Exec and MMDS/management communication remain available; ordinary guest internet egress is not supplied. The deployment does not install NAT or a GENEVE gateway. See the versioned [node-infra guide](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261110/docs/node-infra.md) for prerequisites and configuration.

    ### Installation guide compatibility

    The installation guide recognizes the complete 18-asset `node-infra-v1` layout and retains fixed GitHub asset-ID downloads with native size and SHA-256 verification. Node-infra OCI images and the deployment archive remain separate from native product extraction. See the fixed-revision [English](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/aa623ff2da9dbb37225d3316e665b00ba015c04a/docs/installation.md) and [Chinese](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/aa623ff2da9dbb37225d3316e665b00ba015c04a/docs/installation_zh.md) guides. The [supplementary x86_64/aarch64 download check](https://github.com/kuasar-sandbox/kuasar-sandbox/actions/runs/42784963708) validates these corrected commands against the existing v0.1.13 assets. This guide correction leaves the six selected component versions unchanged.

