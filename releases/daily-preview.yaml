    | `vmlinux` | `vmlinux-v0.1.6-preview.20261104` |

    Six release units from five independently versioned repositories; `guest-runtime` supplies both `runtime` and `vmlinux`.

    ## Component updates

    ### accelerator

    Selected version unchanged: `v0.1.10`. No source changes are included.

    ### connector

    Selected version unchanged: `v0.1.6`. No source changes are included.

    ### sandboxer

    Selected version: `v0.1.12` → `v0.1.13-preview.20261104.1`.

    - vhost: negotiate SEG\_MAX and gather fragmented block reads in bounded windows ([#401](https://github.com/kuasar-sandbox/sandboxer/pull/401), [commit c6fd3dd84345](https://github.com/kuasar-sandbox/sandboxer/commit/c6fd3dd84345cba325256524e60897b81992a5b2)).
    - perf(balloon): coalesce cold inflate releases within each descriptor ([#404](https://github.com/kuasar-sandbox/sandboxer/pull/404), [commit 060154797297](https://github.com/kuasar-sandbox/sandboxer/commit/060154797297ab389fc5df5fdbd3276f3992da5d)).
    - artifact: avoid reading retained parents during publication ([#405](https://github.com/kuasar-sandbox/sandboxer/pull/405), [commit 9481156e0431](https://github.com/kuasar-sandbox/sandboxer/commit/9481156e0431ba41c04de66bf0d8e2df9f5c4cac)).

    [Full comparison](https://github.com/kuasar-sandbox/sandboxer/compare/185f50b641ea84864bc8e0f7bab5c469100d45e3...9481156e0431ba41c04de66bf0d8e2df9f5c4cac)

    ### orchestrator

