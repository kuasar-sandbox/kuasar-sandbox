    # Kuasar Sandbox release-v0.1.12-preview.20261104.2

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.1.11`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.12-preview.20261104.2/releases/daily-preview.yaml).

    ## Platform and delivery updates

    This Preview rebuilds the platform, all 17 declared helpers and both Workbench images after the release/CI simplification. The six component artifacts below are unchanged from the November 4 `.1` selection; no later component source changes are included.

    - Download packages from the selected aggregate tag manifest using GitHub asset IDs, sizes and digests; historical Release body records and checksum attachments are no longer required ([#325](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/325)).
    - Publish human release notes and packages without machine acceptance blocks or a separate checksum attachment, while validating the current package combination and uploaded bytes ([#326](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/326)).
    - Keep complete helper inventories and the runtime information needed to run them; use explicit local Go module workspaces for selected-source builds ([#328](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/328), [#329](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/329)).
    - Preserve normal image runtime information and restore an interrupted publication from its still-valid accepted stage before selecting newer inputs ([#331](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/331), [#335](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/335)).

    `release-v0.1.11` remains marked **Do not use**. The current Stable Latest remains `release-v0.1.10`; this Preview does not publish `v0.1.12` Stable.

