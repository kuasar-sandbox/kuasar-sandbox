    # Kuasar Sandbox release-v0.1.12-preview.20261104.1

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.1.11`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.12-preview.20261104.1/releases/daily-preview.yaml).

    ## Component versions

    | Release unit | Version |
    |---|---|
    | `accelerator` | `v0.1.10` |
    | `connector` | `v0.1.6` |
    | `sandboxer` | `v0.1.13-preview.20261104.1` |
    | `orchestrator` | `v0.1.12-preview.20261104.1` |
    | `runtime` | `runtime-v0.1.12-preview.20261104.1` |
    | `vmlinux` | `vmlinux-v0.1.6-preview.20261104` |

    Six release units from five independently versioned repositories; `guest-runtime` supplies both `runtime` and `vmlinux`.

    ## Component updates

    ### accelerator

    Selected version unchanged: `v0.1.10`.

    ### connector

    Selected version unchanged: `v0.1.6`.

    ### sandboxer

    Selected version: `v0.1.12` → `v0.1.13-preview.20261104.1`.

    - vhost: negotiate SEG\_MAX and gather fragmented block reads in bounded windows ([#401](https://github.com/kuasar-sandbox/sandboxer/pull/401), [commit c6fd3dd84345](https://github.com/kuasar-sandbox/sandboxer/commit/c6fd3dd84345cba325256524e60897b81992a5b2)).
    - perf(balloon): coalesce cold inflate releases within each descriptor ([#404](https://github.com/kuasar-sandbox/sandboxer/pull/404), [commit 060154797297](https://github.com/kuasar-sandbox/sandboxer/commit/060154797297ab389fc5df5fdbd3276f3992da5d)).
    - artifact: avoid reading retained parents during publication ([#405](https://github.com/kuasar-sandbox/sandboxer/pull/405), [commit 9481156e0431](https://github.com/kuasar-sandbox/sandboxer/commit/9481156e0431ba41c04de66bf0d8e2df9f5c4cac)).

    [Full comparison](https://github.com/kuasar-sandbox/sandboxer/compare/185f50b641ea84864bc8e0f7bab5c469100d45e3...9481156e0431ba41c04de66bf0d8e2df9f5c4cac)

    ### orchestrator

    Selected version: `v0.1.11` → `v0.1.12-preview.20261104.1`.

    - test: make checkpoint ZIP fixtures deterministic ([#502](https://github.com/kuasar-sandbox/orchestrator/pull/502), [commit ca809e5530d6](https://github.com/kuasar-sandbox/orchestrator/commit/ca809e5530d647c0ae23602df2751f6685b9f0c1)).
    - fix: reuse registry transports across membership and endpoint requests ([#496](https://github.com/kuasar-sandbox/orchestrator/pull/496), [commit 6fbe4c0b4bc8](https://github.com/kuasar-sandbox/orchestrator/commit/6fbe4c0b4bc8f4753994083c63c2b0c47a06067f)).

    [Full comparison](https://github.com/kuasar-sandbox/orchestrator/compare/852dbc5c4ef0ad8fefa358fb588e2c8e7f7d06e8...6fbe4c0b4bc8f4753994083c63c2b0c47a06067f)

