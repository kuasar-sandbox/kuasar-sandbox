    - test: make checkpoint ZIP fixtures deterministic ([#502](https://github.com/kuasar-sandbox/orchestrator/pull/502), [commit ca809e5530d6](https://github.com/kuasar-sandbox/orchestrator/commit/ca809e5530d647c0ae23602df2751f6685b9f0c1)).
    - fix: reuse registry transports across membership and endpoint requests ([#496](https://github.com/kuasar-sandbox/orchestrator/pull/496), [commit 6fbe4c0b4bc8](https://github.com/kuasar-sandbox/orchestrator/commit/6fbe4c0b4bc8f4753994083c63c2b0c47a06067f)).

    [Full comparison](https://github.com/kuasar-sandbox/orchestrator/compare/852dbc5c4ef0ad8fefa358fb588e2c8e7f7d06e8...6fbe4c0b4bc8f4753994083c63c2b0c47a06067f)

    ### runtime

    Selected version: `runtime-v0.1.11` → `runtime-v0.1.12-preview.20261104.1`.

    The following repository history also includes shared guest-runtime and kernel changes; it is not limited to runtime-specific source changes.

    - perf(vmlinux): batch balloon pages within the upstream ACK bound ([#108](https://github.com/kuasar-sandbox/guest-runtime/pull/108), [commit 05ec31e0be19](https://github.com/kuasar-sandbox/guest-runtime/commit/05ec31e0be19765dc54a96b71fb73a68068992fd)).

    [Full comparison](https://github.com/kuasar-sandbox/guest-runtime/compare/9cda6a9bea6951882b68575016c63d8d74cbcb78...05ec31e0be19765dc54a96b71fb73a68068992fd)

    ### vmlinux

    Selected version: `vmlinux-v0.1.5` → `vmlinux-v0.1.6-preview.20261104`.

    Kernel release inputs: `native-deps/deps/vmlinux/*.config` and `native-deps/deps/linux-patches/`.

    - perf(vmlinux): batch balloon pages within the upstream ACK bound ([#108](https://github.com/kuasar-sandbox/guest-runtime/pull/108), [commit 05ec31e0be19](https://github.com/kuasar-sandbox/guest-runtime/commit/05ec31e0be19765dc54a96b71fb73a68068992fd)).

    [Full comparison](https://github.com/kuasar-sandbox/guest-runtime/compare/9cda6a9bea6951882b68575016c63d8d74cbcb78...05ec31e0be19765dc54a96b71fb73a68068992fd)

    ## Download and use

    - Choose native Linux x86_64 or aarch64 assets. Follow the download guide to verify GitHub asset sizes and SHA-256 digests before use.
    - Extract the six product archives and `platform-release` together. The platform archive contains guides, Demo, tests, helpers and locked wheels.
    - Workbench is a separate compressed Docker image archive: import it with `docker load -i`; do not extract it into products.

    See [Quick Start](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.12-preview.20261104.2/docs/quickstart.md) for host prerequisites and sandbox lifecycle examples, and [Deployment](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.12-preview.20261104.2/docs/deployment.md) for TLS, storage, network policy, credentials and recovery. Demo credentials and self-signed certificates are for evaluation only.

    ## Security

    Workbench system mode is a trusted administrator environment with Docker privileged access. Private namespaces/data and owned cleanup do not provide hostile-root confinement.

    Report vulnerabilities privately through [Report a vulnerability](https://github.com/kuasar-sandbox/kuasar-sandbox/security/advisories/new), not public issues.
