    [Full comparison](https://github.com/kuasar-sandbox/guest-runtime/compare/9cda6a9bea6951882b68575016c63d8d74cbcb78...05ec31e0be19765dc54a96b71fb73a68068992fd)

    ### vmlinux

    Selected version: `vmlinux-v0.1.5` → `vmlinux-v0.1.6-preview.20261104`.

    Kernel release inputs: `native-deps/deps/vmlinux/*.config` and `native-deps/deps/linux-patches/`.

    - perf(vmlinux): batch balloon pages within the upstream ACK bound ([#108](https://github.com/kuasar-sandbox/guest-runtime/pull/108), [commit 05ec31e0be19](https://github.com/kuasar-sandbox/guest-runtime/commit/05ec31e0be19765dc54a96b71fb73a68068992fd)).

    [Full comparison](https://github.com/kuasar-sandbox/guest-runtime/compare/9cda6a9bea6951882b68575016c63d8d74cbcb78...05ec31e0be19765dc54a96b71fb73a68068992fd)

    ## Download and use

    - Choose native Linux x86_64 or aarch64 assets. Verify downloaded archives with `SHA256SUMS` before use.
    - Extract the six product archives and `platform-release` together. The platform archive contains guides, Demo, tests, helpers and locked wheels.
    - Workbench is a separate compressed Docker image archive: import it with `docker load -i`; do not extract it into products.

    See [Quick Start](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.12-preview.20261104.1/docs/quickstart.md) for host prerequisites and sandbox lifecycle examples, and [Deployment](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.12-preview.20261104.1/docs/deployment.md) for TLS, storage, network policy, credentials and recovery. Demo credentials and self-signed certificates are for evaluation only.

    ## Qualification scope

    The declared native x86_64 profile uses the current full ordinary case selection. The hosted ARM profile requires native non-KVM image/storage E2E and `artifact-only` Workbench qualification; planned Workbench cases do not establish network, KVM lifecycle or snapshot/restore execution. Consult the per-architecture validation records for executed cases and `qualification_scope`, including any `native-full` acceptance. These are declared profiles, not evidence that every planned test ran.

    ## Security

    Workbench system mode is a trusted administrator environment with Docker privileged access. Private namespaces/data and owned cleanup do not provide hostile-root confinement.

    Report vulnerabilities privately through [Report a vulnerability](https://github.com/kuasar-sandbox/kuasar-sandbox/security/advisories/new), not public issues.
