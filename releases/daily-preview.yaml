    - release: keep the selected compiler for Preview workspace initialization ([#234](https://github.com/kuasar-sandbox/accelerator/pull/234), [commit 0fd72e30c146](https://github.com/kuasar-sandbox/accelerator/commit/0fd72e30c146947d0f2eb4ba7d5b71dc58533ff2)).

