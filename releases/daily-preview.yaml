    # Kuasar Sandbox release-v0.2.0-preview.20261112

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.2.0-preview.20261111`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261112/releases/daily-preview.yaml).

    ## Component versions

    | Release unit | Version |
    |---|---|
    | `accelerator` | `v0.1.12` |
    | `connector` | `v0.1.8` |
    | `sandboxer` | `v0.1.15` |
    | `orchestrator` | `v0.2.0-preview.20261112` |
    | `runtime` | `runtime-v0.2.0-preview.20261112` |
    | `vmlinux` | `vmlinux-v0.1.6` |

    Six release units from five independently versioned repositories; `guest-runtime` supplies both `runtime` and `vmlinux`.

    ## Component updates

    ### accelerator

    Selected version unchanged: `v0.1.12`.

    ### connector

    Selected version unchanged: `v0.1.8`.

    ### sandboxer

    Selected version: `v0.1.14` → `v0.1.15`.

    - build: align Go and release dependencies with published component versions ([#433](https://github.com/kuasar-sandbox/sandboxer/pull/433), [commit 40285f9c83a7](https://github.com/kuasar-sandbox/sandboxer/commit/40285f9c83a7da9b7ea35e5c62a60ed5ba66237e)).

    [Full comparison](https://github.com/kuasar-sandbox/sandboxer/compare/4d788fe5cda1d5bcaa20eec8ee0fd9f5da08e015...40285f9c83a7da9b7ea35e5c62a60ed5ba66237e)

    ### orchestrator

    Selected version: `v0.1.13` → `v0.2.0-preview.20261112`.

    - Fix standalone Go dependencies for external consumers ([#539](https://github.com/kuasar-sandbox/orchestrator/pull/539), [commit b2a3384959bf](https://github.com/kuasar-sandbox/orchestrator/commit/b2a3384959bfc545d01d38ff220438edb154d5df)).

    [Full comparison](https://github.com/kuasar-sandbox/orchestrator/compare/10215d6f2d6bbf9e6b2c6a1c53706fde4efaceaf...b2a3384959bfc545d01d38ff220438edb154d5df)

