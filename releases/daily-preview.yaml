    # Kuasar Sandbox release-v0.2.0-preview.20261110.1

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: [`release-v0.2.0-preview.20261110`](https://github.com/kuasar-sandbox/kuasar-sandbox/releases/tag/release-v0.2.0-preview.20261110). The previous Stable baseline remains [`release-v0.1.13`](https://github.com/kuasar-sandbox/kuasar-sandbox/releases/tag/release-v0.1.13).

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261110.1/releases/daily-preview.yaml).

    ## Component version line transition

    This Preview moves `accelerator`, `connector`, `sandboxer`, `orchestrator` and `runtime` onto the aggregate's v0.2.0 development line. The four ordinary component tags use `v0.2.0-preview.20261110.1`; Runtime uses `runtime-v0.2.0-preview.20261110.1`. The next Stable cut for these five units is intended to use `v0.2.0` and `runtime-v0.2.0`, respectively.

    The dependency selections move together: Sandboxer uses this Preview's Accelerator and Connector; Orchestrator uses its Accelerator, Connector and Sandboxer; Runtime uses its Accelerator and the published Sandboxer payload. The exact versions appear below.

    The kernel selection remains `vmlinux-v0.1.6`. The aggregate retains the `node-infra-v1` delivery layout. Platform changes introduced by the preceding Preview remain documented in that release; use this Preview's versioned guides below for installation and deployment.

    ## Component versions

    | Release unit | Version |
    |---|---|
    | `accelerator` | `v0.2.0-preview.20261110.1` |
    | `connector` | `v0.2.0-preview.20261110.1` |
    | `sandboxer` | `v0.2.0-preview.20261110.1` |
