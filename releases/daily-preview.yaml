    # Kuasar Sandbox release-v0.2.0-preview.20261114.1

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.2.0-preview.20261112`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261114.1/releases/daily-preview.yaml).

    ## Component versions

    | Release unit | Version |
    |---|---|
    | `accelerator` | `v0.2.0-preview.20261114` |
    | `connector` | `v0.2.0-preview.20261114.1` |
    | `sandboxer` | `v0.2.0-preview.20261114.1` |
    | `orchestrator` | `v0.2.0-preview.20261114.1` |
    | `runtime` | `runtime-v0.2.0-preview.20261114.1` |
    | `vmlinux` | `vmlinux-v0.1.7-preview.20261114.1` |

    Six release units from five independently versioned repositories; `guest-runtime` supplies both `runtime` and `vmlinux`.

