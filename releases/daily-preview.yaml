    # Kuasar Sandbox release-v0.2.0-preview.20261124.4

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.2.0-preview.20261124.2`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261124.4/releases/daily-preview.yaml).

    ## Component versions

    | Release unit | Version |
    |---|---|
    | `accelerator` | `v0.2.0-preview.20261124` |
    | `connector` | `v0.2.0-preview.20261119` |
    | `sandboxer` | `v0.2.0-preview.20261124.3` |
    | `orchestrator` | `v0.2.0-preview.20261124.4` |
    | `runtime` | `runtime-v0.2.0-preview.20261124` |
    | `vmlinux` | `vmlinux-v0.1.7-preview.20261124` |

    Six release units from five independently versioned repositories; `guest-runtime` supplies both `runtime` and `vmlinux`.

    ## Component updates

    ### accelerator

    Selected version unchanged: `v0.2.0-preview.20261124`.

    ### connector

    Selected version unchanged: `v0.2.0-preview.20261119`.

    ### sandboxer

    Selected version: `v0.2.0-preview.20261124.1` → `v0.2.0-preview.20261124.3`.

    - Declare captured runtime before Snapshot holder commit ([#474](https://github.com/kuasar-sandbox/sandboxer/pull/474), [commit 2f6187eb2658](https://github.com/kuasar-sandbox/sandboxer/commit/2f6187eb26585215d57658382753c9ceaf38c2e3)).

    [Full comparison](https://github.com/kuasar-sandbox/sandboxer/compare/347b3fe657b66f69b0a86ce2c428bdb484471663...2f6187eb26585215d57658382753c9ceaf38c2e3)

    ### orchestrator

    Selected version: `v0.2.0-preview.20261124.2` → `v0.2.0-preview.20261124.4`.

    - Add registration-fenced Group support repository ([#573](https://github.com/kuasar-sandbox/orchestrator/pull/573), [commit caa007de10fc](https://github.com/kuasar-sandbox/orchestrator/commit/caa007de10fcf156e239af7c820f952d9945c2f6)).
    - feat(cluster): activate Node-owned Groups and Registry placement ([#574](https://github.com/kuasar-sandbox/orchestrator/pull/574), [commit b5217cde782c](https://github.com/kuasar-sandbox/orchestrator/commit/b5217cde782c145e0611b0a5c807d82ddb4b09ba)).

    - Preserve runtime declarations in Builder and Snapshot E2E assertions ([#575](https://github.com/kuasar-sandbox/orchestrator/pull/575)).

    [Full comparison](https://github.com/kuasar-sandbox/orchestrator/compare/v0.2.0-preview.20261124.2...v0.2.0-preview.20261124.4)

    ### runtime

    Selected version unchanged: `runtime-v0.2.0-preview.20261124`.

    ### vmlinux

    Selected version unchanged: `vmlinux-v0.1.7-preview.20261124`.

    ## Platform acceptance

    - Accept runtime-declared memory exports in Quick Start while retaining the complete TemplateID for cold restore ([#438](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/438)).
    - This selection supersedes the unpublished `.20261124.3` aggregate, whose final combination exposed stale E2E reference assertions. The last complete aggregate `.20261124.2` remains the update baseline.

    ## Download and use

    - Choose native Linux x86_64 or aarch64 assets. Follow the download guide to verify GitHub asset sizes and SHA-256 digests before use.
    - Extract the six product archives and `platform-release` together. The platform archive contains guides, Demo, tests, helpers and locked wheels.
    - Workbench is a separate compressed Docker image archive: import it with `docker load -i`; do not extract it into products.

    See [Quick Start](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261124.4/docs/quickstart.md) for host prerequisites and sandbox lifecycle examples, and [Deployment](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261124.4/docs/deployment.md) for TLS, storage, network policy, credentials and recovery. Demo credentials and self-signed certificates are for evaluation only.

    ## Security

    Workbench system mode is a trusted administrator environment with Docker privileged access. Private namespaces/data and owned cleanup do not provide hostile-root confinement.

    Report vulnerabilities privately through [Report a vulnerability](https://github.com/kuasar-sandbox/kuasar-sandbox/security/advisories/new), not public issues.
