    - test(e2e): allocate activation ports at each scenario boundary ([#237](https://github.com/kuasar-sandbox/accelerator/pull/237), [commit 00a1d87c22dd](https://github.com/kuasar-sandbox/accelerator/commit/00a1d87c22dd1f316484f0e317f13f83b68a381e)).

    [Full comparison](https://github.com/kuasar-sandbox/accelerator/compare/0fd72e30c146947d0f2eb4ba7d5b71dc58533ff2...00a1d87c22dd1f316484f0e317f13f83b68a381e)

