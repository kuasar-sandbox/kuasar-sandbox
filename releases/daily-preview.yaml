    ### vmlinux

    Selected version unchanged: `vmlinux-v0.1.7-preview.20261115.1`.

    ## Upgrade requirements

    Upgrade sandboxer and orchestrator together. The retained-memory account and checkpoint management protocols require the paired versions; old controllers cannot safely accept the new collection handoff. Existing receipt/database migration preserves registrations and source identities. Downgrade requires drained instances/holders and an explicitly compatible state or backup; do not start older binaries on v2 receipts or the migrated database.

    This selection pairs the named-checkpoint SDK and orchestrator releases. The complete selected packages require the normal exact-assets E2E and Workbench qualification before aggregate publication. Functional coverage, performance comparisons and measurement limits are recorded in the [acceptance report](https://github.com/kuasar-sandbox/sandboxer/issues/467#issuecomment-7050517997).

    ## Download and use

    - Choose native Linux x86_64 or aarch64 assets. Follow the download guide to verify GitHub asset sizes and SHA-256 digests before use.
    - Extract the six product archives and `platform-release` together. The platform archive contains guides, Demo, tests, helpers and locked wheels.
    - Workbench is a separate compressed Docker image archive: import it with `docker load -i`; do not extract it into products.

    See [Quick Start](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261121.1/docs/quickstart.md) for host prerequisites and sandbox lifecycle examples, and [Deployment](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261121.1/docs/deployment.md) for TLS, storage, network policy, credentials and recovery. Demo credentials and self-signed certificates are for evaluation only.

    ## Security

    Workbench system mode is a trusted administrator environment with Docker privileged access. Private namespaces/data and owned cleanup do not provide hostile-root confinement.

    Report vulnerabilities privately through [Report a vulnerability](https://github.com/kuasar-sandbox/kuasar-sandbox/security/advisories/new), not public issues.
