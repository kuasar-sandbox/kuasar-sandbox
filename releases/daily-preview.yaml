  body: |
    # Kuasar Sandbox release-v0.2.0-preview.20261114.1

    This aggregate is a Preview selection for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.2.0-preview.20261112`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261114.1/releases/daily-preview.yaml).

    ## Component versions

    | Release unit | Version |
    |---|---|
    | `accelerator` | `v0.2.0-preview.20261114` |
    | `connector` | `v0.2.0-preview.20261114.1` |
    | `sandboxer` | `v0.2.0-preview.20261114.1` |
    | `orchestrator` | `v0.2.0-preview.20261112` |
    | `runtime` | `runtime-v0.2.0-preview.20261114.1` |
    | `vmlinux` | `vmlinux-v0.1.7-preview.20261114.1` |

    Six release units from five independently versioned repositories; `guest-runtime` supplies both `runtime` and `vmlinux`.

    ## Component updates

    - Accelerator selection advances from `v0.1.12` to `v0.2.0-preview.20261114`.
    - Connector selection advances from `v0.1.8` to `v0.2.0-preview.20261114.1`.
    - Runtime selection advances from `runtime-v0.2.0-preview.20261112` to `runtime-v0.2.0-preview.20261114.1`.
    - Kernel selection advances from `vmlinux-v0.1.6` to `vmlinux-v0.1.7-preview.20261114.1`.
    - Sandboxer selection advances from `v0.1.15` to `v0.2.0-preview.20261114.1` after its required dependency alignment.
    - Orchestrator retains its previously selected published version until its dependency alignment is complete.

    This explicit same-day revision retains the already published Accelerator, Connector, Runtime and kernel assets. Runtime and kernel include the merged deferred-disk binding changes. The Sandboxer tag is prepared for normal publication only after its dependency-alignment PR passes required checks and merges. Orchestrator dependency alignment and publication follow after the Sandboxer release is ready. Existing published tags and assets remain unchanged. Exact-assets integration E2E and aggregate delivery validation remain required before publication; this selection is not acceptance evidence.

    ## Download and use

    - Choose native Linux x86_64 or aarch64 assets. Follow the download guide to verify GitHub asset sizes and SHA-256 digests before use.
    - Extract the six product archives and `platform-release` together. The platform archive contains guides, Demo, tests, helpers and locked wheels.
    - Workbench is a separate compressed Docker image archive: import it with `docker load -i`; do not extract it into products.

    See [Quick Start](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261114.1/docs/quickstart.md) for host prerequisites and sandbox lifecycle examples, and [Deployment](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261114.1/docs/deployment.md) for TLS, storage, network policy, credentials and recovery. Demo credentials and self-signed certificates are for evaluation only.

    ## Security

    Workbench system mode is a trusted administrator environment with Docker privileged access. Private namespaces/data and owned cleanup do not provide hostile-root confinement.

    Report vulnerabilities privately through [Report a vulnerability](https://github.com/kuasar-sandbox/kuasar-sandbox/security/advisories/new), not public issues.
