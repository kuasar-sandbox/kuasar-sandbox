  body: |
    # Kuasar Sandbox release-v0.2.0-preview.20261123.1

    This aggregate is a Preview GitHub prerelease for development and evaluation. It does not replace the current Stable release.

    Previous aggregate selection: `release-v0.2.0-preview.20261123`.

    Selection and editable release notes: [`releases/daily-preview.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261123.1/releases/daily-preview.yaml).

    ## Workbench and CI

    Workbench adds the native prerequisites for building a private systemd and D-Bus installation: `busybox-static`, `libacl1-dev`, `libblkid-dev`, `libexpat1-dev`, `liblzma-dev`, `libmount-dev`, `libpcre2-dev`, `libsystemd-dev`, `meson`, `patchelf`, and `python3-jinja2`.

    Native Workbench qualification now uses the existing selected-source Go workspace policy. Declared dependencies on managed modules resolve to the exact local sources admitted for the build, including when the corresponding Stable tag has not been published. The existing ordinary-user build checks remain in place. See [platform #435](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/435).

    Native product qualification also validates the collected `cluster-ctl` runtime, its two fixed launcher links, and the executable's identity against the selected Orchestrator build output. The required product inventory and complete private runtime allowlist remain enforced.

    Workbench and the compiler-free CI execution image bootstrap CA trust before downloading the remaining Ubuntu packages over verified HTTPS. The archive hosts, package selections, signature checks, TLS verification and CI time limits are unchanged.

    All six product component tags are unchanged from `release-v0.2.0-preview.20261123`. The selected Runtime remains `runtime-v0.2.0-preview.20261121`; Guest `launch.systemd` support is not included in this aggregate.

