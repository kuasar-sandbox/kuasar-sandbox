    Six release units from five independently versioned repositories; `guest-runtime` supplies both `runtime` and `vmlinux`.

    ## Component updates

    ### accelerator

    Selected version changes from `v0.1.12` to `v0.2.0-preview.20261110.1`.

    ### connector

    Selected version changes from `v0.1.8` to `v0.2.0-preview.20261110.1`.

    ### sandboxer

    Selected version changes from `v0.1.14` to `v0.2.0-preview.20261110.1`. Build dependencies: Accelerator `v0.2.0-preview.20261110.1` and Connector `v0.2.0-preview.20261110.1`.

    ### orchestrator

    Selected version changes from `v0.1.13` to `v0.2.0-preview.20261110.1`. Build dependencies: Accelerator `v0.2.0-preview.20261110.1`, Connector `v0.2.0-preview.20261110.1` and Sandboxer `v0.2.0-preview.20261110.1`.

    ### runtime

    Selected version changes from `runtime-v0.1.13` to `runtime-v0.2.0-preview.20261110.1`. Runtime uses Accelerator `v0.2.0-preview.20261110.1` for `flatten-ctl` and embeds `sandbox-init` from the published Sandboxer `v0.2.0-preview.20261110.1` release.

    ### vmlinux

    Selected version unchanged: `vmlinux-v0.1.6`. Documentation-only changes do not require a new kernel release.

    ## Download and use

    - Choose native Linux x86_64 or aarch64 assets. Follow the [English](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261110.1/docs/installation.md) or [Chinese](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261110.1/docs/installation_zh.md) download guide to verify GitHub asset sizes and SHA-256 digests before use.
    - Extract the six product archives and `platform-release` together. The platform archive contains guides, Demo, tests, helpers and locked wheels.
    - Workbench is a separate compressed Docker image archive: import it with `docker load -i`; do not extract it into products.
    - Node-infra OCI images and the shared deployment archive follow the versioned [node-infra guide](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261110.1/docs/node-infra.md).

    See [Quick Start](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261110.1/docs/quickstart.md) for host prerequisites and sandbox lifecycle examples, and [Deployment](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.2.0-preview.20261110.1/docs/deployment.md) for TLS, storage, network policy, credentials and recovery. Demo credentials and self-signed certificates are for evaluation only.

    ## Security

    Workbench system mode is a trusted administrator environment with Docker privileged access. Private namespaces/data and owned cleanup do not provide hostile-root confinement.

    Report vulnerabilities privately through [Report a vulnerability](https://github.com/kuasar-sandbox/kuasar-sandbox/security/advisories/new), not public issues.
