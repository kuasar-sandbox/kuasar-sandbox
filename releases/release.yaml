    ## Deployment

    Native Linux x86_64/aarch64. Extract products/platform together; import Workbench separately: `docker load -i`.

    - [Quick Start](/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.11/docs/quickstart.md)
    - [Deployment](/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.11/docs/deployment.md)
    - [Private vulnerability reports](/kuasar-sandbox/kuasar-sandbox/security/advisories/new)

    ## Known limitation

    [#501](/kuasar-sandbox/orchestrator/issues/501): After restoring a published Build and pausing, high-level export to a new template can fail with HTTP 500 when a second-generation checkpoint retains an external named parent ref (missing parent-location mapping). Local checkpoint capture works.

    ## Validation scope

    Product E2E: 88/88 per architecture. Workbench: x86_64 native-full 88/88; aarch64 artifact-only (no system execution established).

