    Runtime and VMLinux are independently versioned units from the guest-runtime repository. The selected kernel source updates delivery documentation without new kernel product inputs relative to `vmlinux-v0.1.6`; the Runtime also incorporates the selected Accelerator and sandbox-init inputs.

    ## Downloads and deployment

    The complete aggregate contains 18 assets: twelve native component archives, one platform archive, two Workbench archives, two node-infra OCI archives and one shared node-infra deployment archive. Verify native GitHub asset sizes and SHA-256 digests using the [download guide](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.13/docs/download.md). Follow the selected [node-infra guide](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.13/docs/node-infra.md) for host prerequisites, image identity, configuration and recovery.

    Workbench and node-infra system containers are trusted-administrator privileged environments, not hostile-root confinement. Full node-infra instance shutdown stops its running VMs; preserve workload state through the documented Pause/Export procedure before replacement.

    ## Known limits

    - [Platform #347](https://github.com/kuasar-sandbox/kuasar-sandbox/issues/347) and [#324](https://github.com/kuasar-sandbox/kuasar-sandbox/issues/324) remain open. The journal fix does not establish the cause of every reported high-density symptom or resolve Guest RCU stalls. Qualify density, lifecycle operations and restore behavior on the intended hardware.
    - [Platform #304](https://github.com/kuasar-sandbox/kuasar-sandbox/issues/304) remains open: Placer/Router do not support Registry-style SIGHUP reload. Use the documented restart procedure.
    - Node-infra Builder coverage establishes warm-pool startup and cleanup, not a Build transaction or Builder VM. Physical host reboot and physical VF qualification are not claimed.
    - The preceding Preview used the earlier platform selection without node-infra and skipped performance tests. Its results do not substitute for this aggregate's exact-asset acceptance or establish performance certification.

    Stable identifies the release channel, not workload-specific production certification. Report security issues privately through [Report a vulnerability](https://github.com/kuasar-sandbox/kuasar-sandbox/security/advisories/new).
