  body: |
    # Kuasar Sandbox release-v0.1.11

    Stable release.

    ## Important upgrade notice

    **No arbitrary mixed-version rolling upgrades**
    - Fresh installs create SQLite schema; upgrades require `sandboxes.max_checkpoints` (unconverted v0.1.10 fails). No automatic column migration, even with additive Reset migration. Keep verified DB/artifact backups; validate schema/data transition. Never delete DB/add columns to bypass checks; no lossless in-place guarantee.
    - Match conductor/proxy/node-link/cluster (routesync/node-link 10; Proxy SHM ABI 9), or fail closed.
    - `crypto.ref` defaults to `auto`, independent of `crypto.local`. `auto` plaintext reads skip key lookup; encrypted reads need the correct key. `auto`/`required` publisher creation needs valid customer keys; new tarstreams are encrypted. `off` reads/writes only plaintext; `required` rejects it. Missing keys: no plaintext fallback. Config-free CLI named-location publication: `MANIFEST_KEY`; SDK: task-scoped customer-key resolver. To preserve old ref policy, set `crypto.ref: off` for former `crypto.local: off`, or `crypto.ref: required` for former `crypto.local: required`. No automatic graph re-encryption; Manifest/Bundle encoding unchanged.
    - Dead sandboxes retain current disks/checkpoints until Delete or `dead_ttl` (default 24h from first durable dead transition); budget storage and review cache-only DiffCOW settings.
    - #378/#383 remain fixed since `release-v0.1.10`; #378's all-versions warning covers earlier releases only. Upgrade Sandboxer/bundled patched Cloud Hypervisor together, including running processes. Snapshots with lost release history aren't auto-repaired.

    ## Highlights

    - Reset keeps current disks and reconstructs E-only paused state: no memory restore, VM boot, old-run/template/snapshot rollback or cross-node recovery. Wake/Resume starts a new run. `autoReset` is opt-in (default false); missing current-disk metadata fails.
    - Pause uses Proxy activity handshake and `ifIdle`; one sandbox-owned checkpoint survives Resume. Export by ID consumes it on success, retains it on failure.
    - DiffCOW dirty defaults to half merged effective cache; explicit limits stay. Default cache/dirty: 32/16 MiB; cache-only 64 MiB gives 32 MiB dirty.

