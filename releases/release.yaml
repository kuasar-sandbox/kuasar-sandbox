  body: |
    # Kuasar Sandbox release-v0.1.12

    ## Highlights and upgrade requirements

    - Fix the second-generation checkpoint export regression tracked in [orchestrator #501](https://github.com/kuasar-sandbox/orchestrator/issues/501) through [sandboxer #405](https://github.com/kuasar-sandbox/sandboxer/pull/405). Upgrade Sandboxer and Orchestrator together; retain the configured parent locations and encryption keys. `release-v0.1.11` remains withdrawn; this is the next Stable after the recommended `release-v0.1.10`.
    - Add continuous-idle conditional Pause and an instance `idleTimeout` policy ([orchestrator #503](https://github.com/kuasar-sandbox/orchestrator/pull/503)). Omitted or `null` disables automatic scheduling; `0` schedules immediately after trusted idle is observed. `ifIdleSince` requires `ifIdle=true`. Busy or later-idle observations reject with 409; incomplete evidence rejects with 503.
    - **Coordinate the Conductor, Proxy, and cluster endpoint upgrade: Routesync v11 is incompatible with older endpoints.** Migration tokens carrying a non-null idle policy require a receiver that supports the policy. SQLite idle-policy migration is additive; preserve verified database and artifact backups and validate the upgrade before production rollout. Do not assume arbitrary mixed-version rolling upgrades are supported.
    - Retry transient Registry bootstrap failures before Placer initialization ([orchestrator #499](https://github.com/kuasar-sandbox/orchestrator/pull/499)) and reuse Registry HTTP transports ([orchestrator #496](https://github.com/kuasar-sandbox/orchestrator/pull/496)). Deterministic configuration, authentication, TLS, and protocol failures remain errors.
    - Batch guest balloon pages within the upstream ACK bound ([guest-runtime #108](https://github.com/kuasar-sandbox/guest-runtime/pull/108)). The guest kernel and runtime remain independently versioned.
    - All six component units are freshly published from the selected current main commits. Accelerator and Connector have packaging, publisher, and documentation changes without product Go source changes. Component archives contain runtime payloads and licenses; aggregate packages contain runtime helper information. Downloads verify GitHub asset size/digest. No independent SHA256SUMS or historical machine-verification records are published. Use the versioned [download guide](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.12/docs/download.md).

    For installations upgrading from `release-v0.1.10`, the intervening storage and crypto requirements still apply: existing databases require the `sandboxes.max_checkpoints` schema (not supplied by the new additive idle-policy migration); preserve and validate data rather than deleting the database or adding columns to bypass checks. `crypto.ref` defaults to `auto`, independently of `crypto.local`; named-location publishing needs valid customer keys, with no plaintext fallback. To preserve the old reference policy, explicitly use `crypto.ref: off` for former local `off`, or `crypto.ref: required` for former local `required`. No automatic re-encryption or lossless in-place migration is promised. Dead sandboxes retain current disks/checkpoints until Delete or `dead_ttl` (default 24h); budget storage accordingly. See the selected [node guide](https://github.com/kuasar-sandbox/orchestrator/blob/v0.1.12/docs/node.md) and [Sandboxer guide](https://github.com/kuasar-sandbox/sandboxer/blob/v0.1.13/README.md).

    ## Known risks

    - [Platform #324](https://github.com/kuasar-sandbox/kuasar-sandbox/issues/324) remains open: an ARM64 high-density deployment reported systemd stuck in D state during creation and restart, with reservations remaining after sandbox deletion. The root cause and affected release range are unconfirmed; this release does not claim a fix or high-density certification. Validate intended density and lifecycle operations on the target host before rollout.
    - [Platform #304](https://github.com/kuasar-sandbox/kuasar-sandbox/issues/304) remains open: Placer/Router do not support SIGHUP reload and may exit when sent SIGHUP. Use their documented restart procedure; do not send Registry-style reload signals to those services.

    This aggregate is a Stable, non-prerelease release. Channel status does not establish workload-specific production readiness.

    Previous aggregate selection: `release-v0.1.11`.

    Selection and editable release notes: [`releases/release.yaml`](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.12/releases/release.yaml).

