    ## Deployment and security

    Native Linux x86_64 and aarch64. Extract products/platform together; import Workbench separately with `docker load -i`.

    - [Quick Start](/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.11/docs/quickstart.md)
    - [Production deployment](/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.11/docs/deployment.md)
    - [Report vulnerabilities privately](/kuasar-sandbox/kuasar-sandbox/security/advisories/new)

    ## Validation scope

    Product E2E: 88/88 passed per architecture. Workbench: x86_64 native-full (88/88); aarch64 artifact-only, which does not establish system execution.

