  body: |
    # Kuasar Sandbox release-v0.1.14

    This maintenance release updates Orchestrator to v0.1.14. The other five release units retain their v0.1.13 aggregate selections.

    ## Go integration

    External Go programs can import Orchestrator's telemetry package with the module dependencies declared by Orchestrator. Version-qualified installation of node-ctl works with `go install github.com/kuasar-sandbox/orchestrator/cmd/node-ctl@v0.1.14`. Orchestrator now selects the published Sandboxer v0.1.14 and declares the OpenTelemetry xpdata version it uses. See [orchestrator #539](https://github.com/kuasar-sandbox/orchestrator/pull/539).

    ## Installation

    The bundled installation guide supports anonymous download and verification of the node-infra-v1 assets. It includes the corrections previously documented in the v0.1.13 installation erratum ([#385](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/385), [#386](https://github.com/kuasar-sandbox/kuasar-sandbox/pull/386)). Use the deployment instructions for this maintenance line and prepare the same network namespaces and links as for v0.1.13.

    [Component versions](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.14/releases/release.yaml) · [Installation](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.14/docs/installation.md) · [简体中文](https://github.com/kuasar-sandbox/kuasar-sandbox/blob/release-v0.1.14/docs/installation_zh.md)
