name: Daily Preview Branch
run-name: Daily preview ${{ inputs.platform_ref }}@${{ inputs.platform_sha }} for ${{ inputs.date }}

on:
  workflow_dispatch:
    inputs:
      initialize_arm:
        description: Explicit first ARM initialization using new unit versions; never changes historical assets
        required: false
        default: false
        type: boolean
      platform_ref:
        description: Exact maintained platform branch
        required: true
        type: string
      platform_sha:
        description: Exact platform branch HEAD selected by the scanner
        required: true
        type: string
      date:
        description: YYYYMMDD[.N] selection date
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-manifest-selection-and-gc
  cancel-in-progress: false

jobs:
  converge:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out trusted release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact maintained platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.platform_sha }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Check environment GitHub CLI
        run: |
          gh --version
          gh_help="$(gh api --help)"
          [[ "$gh_help" == *--slurp* ]] || { echo "environment gh must support api --slurp" >&2; exit 1; }

      - name: Create cross-repository release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,kuasar-sandbox,orchestrator,sandboxer
          permission-actions: write
          permission-contents: read

      - name: Create platform manifest writer token
        id: platform-writer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: kuasar-sandbox
          permission-contents: write

      - name: Converge branch Preview
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PLATFORM_TOKEN: ${{ steps.platform-writer-token.outputs.token }}
          PLATFORM_ROOT: ${{ github.workspace }}/platform
          PLATFORM_REF: ${{ inputs.platform_ref }}
          PLATFORM_SHA: ${{ inputs.platform_sha }}
          PREVIEW_DATE: ${{ inputs.date }}
          INITIALIZE_ARM: ${{ inputs.initialize_arm }}
          PREVIEW_POLL_SECONDS: "120"
          PREVIEW_WAIT_SECONDS: "3000"
        run: python3 control/release/preview_coordinator.py
