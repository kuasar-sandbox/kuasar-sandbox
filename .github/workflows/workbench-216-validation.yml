name: Workbench 216 Full Validation
run-name: Workbench 216 build, package, restore and exact-product gates @${{ github.sha }}

# Temporary acceptance entry, removed with the same coordinated delivery.
# It never creates releases, tags, publisher tokens or production assets.
on:
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: Optional exact primary repository; blank freezes all six current main heads
        default: ''
        type: string
      candidate_sha:
        description: Existing primary candidate two-parent merge SHA
        default: ''
        type: string
      candidate_pr:
        description: Existing primary open pull request number
        default: ''
        type: string
      candidate_base_sha:
        description: Existing primary base SHA
        default: ''
        type: string
      candidate_base_ref:
        description: Existing primary base ref, main
        default: ''
        type: string
      candidate_head_sha:
        description: Existing primary head SHA
        default: ''
        type: string
      companion_candidates:
        description: Existing exact companion record array declared by the primary PR
        default: '[]'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: workbench-216-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      x86_64_shards: ${{ steps.freeze.outputs.x86_64_shards }}
      aarch64_shards: ${{ steps.freeze.outputs.aarch64_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - name: Admit exact sources and select both native images once
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_BASE_SHA: ${{ inputs.candidate_base_sha }}
          CANDIDATE_BASE_REF: ${{ inputs.candidate_base_ref }}
          CANDIDATE_HEAD_SHA: ${{ inputs.candidate_head_sha }}
          COMPANION_CANDIDATES: ${{ inputs.companion_candidates }}
        run: |
          python3 -B framework/ci/hosted/verify-workbench-216.py freeze \
            --framework-sha "$TRUSTED_WORKFLOW_SHA" --output plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
          if-no-files-found: error
          retention-days: 7

  source-checks:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
      - name: Fetch the frozen full test sources without a compiler
        run: |
          python3 -B framework/ci/integration/run-source-checks.py \
            --plan plan/integration-plan.json --sources source-checks \
            --output "$RUNNER_TEMP/source-materialize.json" --materialize-only
          cp plan/integration-plan.json source-checks/.source-plan.json
      - name: Run the complete required source gate in Workbench system mode
        run: |
          python3 -B framework/ci/hosted/workbench.py start --mode system \
            --selection plan/workbench.json --sources source-checks \
            --root "$RUNNER_TEMP/source-system" --arch x86_64 --cpus 2 --memory-gib 8
          source_script=$(cat <<'WORKBENCH_SOURCE'
          # Match the system executor owner on this private container copy.
          chown -hR 0:0 /src
          sudo -n true
          # These are private instance resources. Old pinned fixtures may skip
          # on unavailable capabilities; this required gate must fail instead.
          trap 'ip link del dev ks-source-probe 2>/dev/null || true; ip netns del ks-source-probe 2>/dev/null || true' EXIT
          ip netns add ks-source-probe
          ip netns del ks-source-probe
          ip tuntap add dev ks-source-probe mode tap
          ip link del dev ks-source-probe
          trap - EXIT
          source /inputs/release/ci/hosted/bootstrap.sh
          export KUASAR_HOSTED_ROOT=/build/source-readers
          export GITHUB_ENV=/build/tmp/source-readers-env GITHUB_PATH=/build/tmp/source-readers-path
          mkdir -p "$KUASAR_HOSTED_ROOT/bin"
          install_readers
          install_runtime_reader
          export PATH="$KUASAR_HOSTED_ROOT/bin:$PATH" KUASAR_CI_DIR=/output/source-metrics
          python3 -B /inputs/release/ci/integration/run-source-checks.py \
            --plan /src/.source-plan.json --sources /src --output /output/source-result.json --materialized
          WORKBENCH_SOURCE
          )
          python3 -B framework/ci/hosted/workbench.py exec --root "$RUNNER_TEMP/source-system" -- \
            bash -euo pipefail -c "$source_script"
      - name: Stop the owned system instance and retain safe source evidence
        if: always()
        run: |
          python3 -B framework/ci/hosted/workbench.py finish --root "$RUNNER_TEMP/source-system" \
            --evidence "$RUNNER_TEMP/source-system-evidence"
      - name: Upload source checks and system diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-source-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-system-evidence
            ${{ runner.temp }}/source-materialize.json
          if-no-files-found: error
          retention-days: 7

  cold-x86:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
      - name: Fetch fresh exact sources without a compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B framework/ci/hosted/verify-workbench-216.py fetch --frozen plan/frozen.json --sources sources
      - name: Cold ordinary UID full build and six exact packages
        id: verification
        uses: ./framework/.github/actions/workbench
        with:
          selection: plan/workbench.json
          sources: sources
          outputs: verification
          cache-coverage: full-manifest
          arch: x86_64
          cpus: '2'
          memory-gib: '8'
          run: python3 -B /inputs/release/ci/hosted/verify-workbench-216.py build --phase cold --arch x86_64
      - name: Retain exact non-native products for the fresh warm job
        if: success() && steps.verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-cold-products-x86_64-${{ github.run_id }}
          path: |
            sources/verification/carried-products.tar
            sources/verification/result.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      # Failure/cancellation diagnostics stay under /output and are exported
      # only by the shared action after stopping the instance and checking them.
      - name: Retain the checked cold result and original validated packages
        if: success() && steps.verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-cold-x86_64-${{ github.run_id }}
          path: |
            sources/verification/result.json
            sources/verification/logs
            sources/verification/native-entries
            sources/verification/packages
            sources/verification/*.tsv
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  cold-arm:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
      - name: Fetch fresh exact sources without a compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B framework/ci/hosted/verify-workbench-216.py fetch --frozen plan/frozen.json --sources sources
      - name: Cold ordinary UID full build and six exact packages
        id: verification
        uses: ./framework/.github/actions/workbench
        with:
          selection: plan/workbench.json
          sources: sources
          outputs: verification
          cache-coverage: full-manifest
          arch: aarch64
          cpus: '2'
          memory-gib: '8'
          run: python3 -B /inputs/release/ci/hosted/verify-workbench-216.py build --phase cold --arch aarch64
      - name: Retain exact non-native products for the fresh warm job
        if: success() && steps.verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-cold-products-aarch64-${{ github.run_id }}
          path: |
            sources/verification/carried-products.tar
            sources/verification/result.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      # Failed candidate source paths are never passed to the host uploader.
      - name: Retain the checked cold result and original validated packages
        if: success() && steps.verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-cold-aarch64-${{ github.run_id }}
          path: |
            sources/verification/result.json
            sources/verification/logs
            sources/verification/native-entries
            sources/verification/packages
            sources/verification/*.tsv
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  legacy-x86:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_ARCH: x86_64
    steps: &legacy_control_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: baae11385c26a55e1c888be4c5334fc0b0b6860d
          path: legacy
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
      - name: Fetch the same frozen sources into fresh task-private host state
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_root=$(mktemp -d "$RUNNER_TEMP/task216-legacy.XXXXXXXX")
          echo "task_root=$task_root" >> "$GITHUB_OUTPUT"
          python3 -B framework/ci/hosted/verify-workbench-216.py fetch \
            --frozen plan/frozen.json --sources "$task_root/sources"
      - name: Run the original host or cross bootstrap and current full cold recipe
        id: verification
        env:
          LEGACY_TASK_ROOT: ${{ steps.inputs.outputs.task_root }}
        run: |
          python3 -B framework/ci/hosted/verify-workbench-216.py legacy-run \
            --arch "$TARGET_ARCH" --sources "$LEGACY_TASK_ROOT/sources" \
            --legacy-framework "$GITHUB_WORKSPACE/legacy" --output "$GITHUB_WORKSPACE/legacy-output"
      - name: Stop only the owned legacy unit and copy checked outputs
        if: always() && steps.inputs.outputs.task_root != ''
        id: finish
        env:
          LEGACY_TASK_ROOT: ${{ steps.inputs.outputs.task_root }}
        run: |
          python3 -B framework/ci/hosted/verify-workbench-216.py legacy-finish \
            --output "$GITHUB_WORKSPACE/legacy-output" --task-root "$LEGACY_TASK_ROOT"
      - name: Retain only successfully checked original legacy packages
        if: success() && steps.verification.outcome == 'success' && steps.finish.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-legacy-cold-${{ env.TARGET_ARCH }}-${{ github.run_id }}
          path: legacy-output/validated
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain host receipts and diagnostics copied after writers stop
        if: always() && steps.inputs.outputs.task_root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-legacy-host-${{ env.TARGET_ARCH }}-${{ github.run_id }}
          path: |
            legacy-output/host/result.json
            legacy-output/host/logs
            legacy-output/diagnostics
          if-no-files-found: warn
          retention-days: 7

  legacy-arm:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_ARCH: aarch64
    steps: *legacy_control_steps

  warm-x86:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: [prepare, cold-x86]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-cold-products-x86_64-${{ github.run_id }}
          path: transport
      - name: Fetch a new source directory and carry only exact non-native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B framework/ci/hosted/verify-workbench-216.py fetch --frozen plan/frozen.json --sources sources
          cp transport/carried-products.tar sources/
          cp transport/result.json sources/cold-result.json
      - name: Require native cache hits and directly package the six units
        id: verification
        uses: ./framework/.github/actions/workbench
        with:
          selection: plan/workbench.json
          sources: sources
          outputs: verification
          cache-coverage: full-manifest
          arch: x86_64
          cpus: '2'
          memory-gib: '8'
          run: python3 -B /inputs/release/ci/hosted/verify-workbench-216.py build --phase warm --arch x86_64
      - name: Retain the checked warm result and directly validated packages
        if: success() && steps.verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-warm-x86_64-${{ github.run_id }}
          path: sources/verification
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  warm-arm:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: [prepare, cold-arm]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-cold-products-aarch64-${{ github.run_id }}
          path: transport
      - name: Fetch a new source directory and carry only exact non-native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B framework/ci/hosted/verify-workbench-216.py fetch --frozen plan/frozen.json --sources sources
          cp transport/carried-products.tar sources/
          cp transport/result.json sources/cold-result.json
      - name: Require native cache hits and directly package the six units
        id: verification
        uses: ./framework/.github/actions/workbench
        with:
          selection: plan/workbench.json
          sources: sources
          outputs: verification
          cache-coverage: full-manifest
          arch: aarch64
          cpus: '2'
          memory-gib: '8'
          run: python3 -B /inputs/release/ci/hosted/verify-workbench-216.py build --phase warm --arch aarch64
      - name: Retain the checked warm result and directly validated packages
        if: success() && steps.verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-warm-aarch64-${{ github.run_id }}
          path: sources/verification
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  helpers-x86:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
      - name: Materialize the independently pinned helper and test sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B framework/ci/hosted/verify-workbench-216.py fetch --frozen plan/frozen.json --sources sources
      - name: Compile only exact test helpers and prepare the pinned test overlays
        id: verification
        uses: ./framework/.github/actions/workbench
        with:
          selection: plan/workbench.json
          sources: sources
          outputs: verification
          arch: x86_64
          cpus: '2'
          memory-gib: '8'
          # A parallel helper job must not occupy the full build's immutable cache key.
          cache: 'false'
          run: python3 -B /inputs/release/ci/hosted/verify-workbench-216.py helpers --arch x86_64 2>&1 | tee /output/helpers-build.log
      - name: Build trusted native readers with the existing pinned recipe
        uses: ./framework/.github/actions/workbench
        with:
          selection: plan/workbench.json
          sources: reader-build
          outputs: |
            reader-tools/bin
            reader-tools/erofs-readers.COPYING
          arch: x86_64
          cpus: '2'
          memory-gib: '8'
          cache: 'false'
          run: |
            source /inputs/release/ci/hosted/bootstrap.sh
            export KUASAR_HOSTED_ROOT=/src/reader-tools
            export GITHUB_ENV=/build/t/reader-env GITHUB_PATH=/build/t/reader-path
            mkdir -p "$KUASAR_HOSTED_ROOT/bin"
            install_readers
            install_runtime_reader
      - name: Transport only checked helpers and readers after both instances stop
        run: |
          tar -cf helper-inputs.tar -C sources/verification integration-helpers
          mkdir readers
          cp reader-build/reader-tools/bin/{mkfs.erofs,fsck.erofs,dump.erofs,runtime-payloads.py} readers/
          cp reader-build/reader-tools/erofs-readers.COPYING readers/
          (cd readers && sha256sum mkfs.erofs fsck.erofs dump.erofs runtime-payloads.py erofs-readers.COPYING > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-helpers-x86_64-${{ github.run_id }}
          path: helper-inputs.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-readers-x86_64-${{ github.run_id }}
          path: readers
          if-no-files-found: error
          retention-days: 7

  prepare-integration-x86:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && github.repository == 'kuasar-sandbox/kuasar-sandbox' && github.ref == 'refs/heads/main'
    needs: [prepare, cold-x86, helpers-x86]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PACKAGE_PREFIX: workbench-216-cold
      DELTA_COMMAND: packaged-delta
      RESULT_PREFIX: workbench-216
    steps: &prepare_x86_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-plan-${{ github.run_id }}
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PACKAGE_PREFIX }}-x86_64-${{ github.run_id }}
          path: cold
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-helpers-x86_64-${{ github.run_id }}
          path: transport
      - name: Bootstrap compiler-free archive preparation
        run: bash framework/ci/hosted/bootstrap.sh --profile artifact-prepare
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: workbench-216-readers-x86_64-${{ github.run_id }}
          path: readers
      - name: Select verified native archive readers
        run: |
          (cd readers && sha256sum --check SHA256SUMS)
          chmod 0755 readers/mkfs.erofs readers/fsck.erofs readers/dump.erofs
          echo "$GITHUB_WORKSPACE/readers" >> "$GITHUB_PATH"
