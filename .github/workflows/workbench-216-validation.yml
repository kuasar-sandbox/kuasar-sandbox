          from pathlib import Path
          spec = importlib.util.spec_from_file_location('task216', 'framework/ci/hosted/verify-workbench-216.py')
          task = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(task)
          frozen = task.frozen(Path('plan/frozen.json'))
          plan = json.loads(Path('plan/integration-plan.json').read_text())
          selection = json.loads(Path('plan/workbench.json').read_text())
          source = task.module('source_checks', task.ROOT / 'ci/integration/run-source-checks.py')
          expected = source.source_records(plan)[1]
          for owner, row in expected.items():
              key = 'kuasar-sandbox' if owner == 'platform' else owner
              task.require(all(row[field] == frozen['test_revisions'][key][field] for field in ('repository', 'sha')),
                           'source plan differs from frozen full task test inputs')
          framework = frozen['framework_sha']
          task.require(plan['framework_sha'] == selection['framework_sha'] == framework, 'source framework mismatch')
          image = selection['architectures']['x86_64']['image_id']
          materialize = json.loads(Path('source/source-materialize.json').read_text())
          result = json.loads(Path('source/source-system-evidence/output/source-result.json').read_text())
          receipt = json.loads(Path('source/source-system-evidence/receipt.json').read_text())
          for record, phase in ((materialize, 'materialize'), (result, 'all')):
              task.require(record['plan_id'] == task.artifacts.identity(plan)
                           and record['framework_sha'] == framework and record['test_revisions'] == plan['test_revisions']
                           and record['sources'] == expected, 'source result input identity mismatch')
              task.require(record['conclusion'] == 'success' and record['exit_code'] == 0 and record['phase'] == phase,
                           'source gate did not complete successfully')
              task.require(record['actions'] and all(row['exit_code'] == 0 for row in record['actions']),
                           'source action failed or did not complete')
          task.require([(row['name'], row['repository'], row['sha']) for row in materialize['actions']]
                       == [('checkout:' + owner, row['repository'], row['sha']) for owner, row in expected.items()],
                       'source materialization is incomplete')
          task.require(result['arch'] == 'x86_64' and result['workbench'] == {'framework_sha': framework, 'image_id': image},
                       'source result used a different Workbench')
          task.require([(row['name'], row['command'], row['directory'], row['exit_code']) for row in result['checks']]
                       == [(name, command, str(directory), 0) for name, command, directory in source.checks_for(plan, Path('/src'))],
                       'required source checks were omitted, changed or failed')
          identities = [row for row in result['actions'] if row['name'].startswith('source-identity:')]
          task.require([(row['name'], row['expected_sha'], row['actual_sha']) for row in identities]
                       == [('source-identity:' + owner, row['sha'], row['sha']) for owner, row in expected.items()],
                       'executed test source identities differ from the frozen plan')
          task.require(receipt['framework_sha'] == framework and receipt['selection'] == selection
                       and receipt['image']['image_id'] == image and receipt['arch'] == 'x86_64' and receipt['mode'] == 'system',
                       'source executor receipt identity mismatch')
          task.require(receipt['conclusion'] == 'success' and receipt.get('cleanup_exit_code') == 0
                       and receipt.get('delete_output_exit_code') == 0 and not receipt.get('diagnostics_error'),
                       'source executor or owned resource cleanup failed')
          task.require(len(receipt['commands']) == 1 and receipt['commands'][0]['exit_code'] == 0
                       and receipt['commands'][0]['argv'][:4] == ['bash', '-euo', 'pipefail', '-c'],
                       'source executor command failed or its completion was not recorded')
          task.write(Path('source-validation.json'), result)
          PYTHON
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: workbench-216-shard-x86_64-*-${{ github.run_id }}
          path: shards/x86_64
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: workbench-216-shard-aarch64-*-${{ github.run_id }}
          path: shards/aarch64
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: workbench-216-legacy-shard-x86_64-*-${{ github.run_id }}
          path: legacy-shards/x86_64
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: workbench-216-legacy-shard-aarch64-*-${{ github.run_id }}
          path: legacy-shards/aarch64
          merge-multiple: true
      - name: Collect the unchanged exact shard and performance contracts
        run: |
          mkdir results legacy-results
          for arch in x86_64 aarch64; do
            python3 -B framework/ci/integration/artifacts.py shard-results \
              --plan plan/integration-plan.json --arch "$arch" --results "shards/$arch" > "results/$arch.json"
            python3 -B framework/ci/integration/artifacts.py shard-results \
              --plan plan/integration-plan.json --arch "$arch" --results "legacy-shards/$arch" > "legacy-results/$arch.json"
          done
          python3 -B framework/ci/integration/artifacts.py results \
            --plan plan/integration-plan.json --results results > validation.json
          python3 -B framework/ci/integration/artifacts.py results \
            --plan plan/integration-plan.json --results legacy-results > legacy-validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-216-integration-validation-${{ github.run_id }}
          path: |
            plan
            results
            validation.json
            legacy-results
            legacy-validation.json
            source
            source-validation.json
          if-no-files-found: error
          retention-days: 7
