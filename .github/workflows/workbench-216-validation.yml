    needs: [prepare, source-checks, cold-x86, cold-arm, warm-x86, warm-arm, helpers-x86, helpers-arm, prepare-integration-x86, prepare-integration-arm, e2e-x86, e2e-arm, performance-x86, legacy-x86, legacy-arm, prepare-legacy-x86, prepare-legacy-arm, e2e-legacy-x86, e2e-legacy-arm, performance-legacy-x86]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every declared source, build, cache, package and native integration job
        env:
          TASK_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -B - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['TASK_JOB_RESULTS'])
          failed = {job: result['result'] for job, result in results.items() if result['result'] != 'success'}
          if failed:
              raise SystemExit('Required task jobs did not pass: ' + json.dumps(failed, sort_keys=True))
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
