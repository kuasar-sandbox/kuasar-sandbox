name: Reusable Artifact Architecture

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      framework_sha:
        required: true
        type: string
      plan_artifact:
        required: true
        type: string
      stage_artifact:
        default: ""
        type: string

permissions:
  contents: read

# Each invocation has its own build -> prepare -> native E2E lifecycle.
concurrency:
  group: artifact-${{ github.repository }}-${{ github.run_id }}-${{ inputs.arch }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      performance: ${{ steps.plan.outputs.performance }}
      product_cases: ${{ steps.plan.outputs.product_cases }}
    env:
      TARGET_ARCH: ${{ inputs.arch }}
      KUASAR_CI_DIR: ${{ github.workspace }}/build-metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ inputs.framework_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan_artifact }}
          path: plan
      - name: Validate trusted architecture and shard selection
        id: plan
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          FRAMEWORK_SHA: ${{ inputs.framework_sha }}
        run: |
          set -euo pipefail
          [ "$FRAMEWORK_SHA" = "$TRUSTED_WORKFLOW_SHA" ]
          case "$TARGET_ARCH" in x86_64|aarch64) ;; *) exit 1 ;; esac
          PYTHONPATH=framework/ci/integration python3 -B - <<'PYTHON'
          import artifacts, json, os
          plan = json.load(open('plan/plan.json'))
          artifacts.check_plan(plan)
          artifacts.require(plan['framework_sha'] == os.environ['FRAMEWORK_SHA'], 'framework revision mismatch')
          groups = artifacts.shards(plan['lanes'][os.environ['TARGET_ARCH']]['selection'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('shards=' + json.dumps(list(groups)) + '\n')
              output.write('performance=' + json.dumps(bool(plan['lanes'][os.environ['TARGET_ARCH']]['performance'])) + '\n')
              output.write('product_cases=' + json.dumps(bool(plan['lanes'][os.environ['TARGET_ARCH']]['selection']['cases'])) + '\n')
          PYTHON
      - name: Build trusted native archive readers in Workbench
        uses: ./framework/.github/actions/workbench
        with:
          selection: plan/workbench.json
          sources: reader-build
          outputs: |
            reader-tools/bin
            reader-tools/erofs-readers.COPYING
          arch: ${{ inputs.arch }}
          cpus: '2'
          memory-gib: '8'
          cache: 'false'
          run: |
            source /inputs/release/ci/hosted/bootstrap.sh
            export KUASAR_HOSTED_ROOT=/src/reader-tools
            export GITHUB_ENV=/build/t/reader-env GITHUB_PATH=/build/t/reader-path
            mkdir -p "$KUASAR_HOSTED_ROOT/bin"
            install_readers
            install_runtime_reader
      - name: Retain trusted readers outside candidate mounts
        run: |
          mkdir readers
          cp reader-build/reader-tools/bin/{mkfs.erofs,fsck.erofs,dump.erofs,runtime-payloads.py} readers/
          cp reader-build/reader-tools/erofs-readers.COPYING readers/
          (cd readers && sha256sum mkfs.erofs fsck.erofs dump.erofs runtime-payloads.py erofs-readers.COPYING > SHA256SUMS)
      - name: Upload immutable native readers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-readers-${{ inputs.arch }}-${{ github.run_id }}
          path: readers
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Download exact aggregate stage
        if: inputs.stage_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.stage_artifact }}
          path: aggregate-stage
      - name: Obtain only this target's exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_ARTIFACT: ${{ inputs.stage_artifact }}
        run: |
          options=()
          if [ -n "$STAGE_ARTIFACT" ]; then options+=(aggregate-stage/assets); fi
          bash framework/ci/integration/download-baseline.sh plan/plan.json "$TARGET_ARCH" assets "${options[@]}"
      - name: Fetch the exact private source and helper set without a compiler
        run: |
          python3 -B framework/ci/integration/build-artifacts.py --materialize-only \
            --plan plan/plan.json --arch "$TARGET_ARCH" --assets assets --sources sources --output delta
          mkdir sources/.ci
          cp plan/plan.json plan/workbench.json sources/.ci/
          cp -a assets readers sources/.ci/
      - name: Build the affected delta and test helpers once
        uses: ./framework/.github/actions/workbench
        with:
          selection: plan/workbench.json
          sources: sources
          cache-coverage: integration-delta
          outputs: |
            .ci/delta
            .ci/build-time.txt
          arch: ${{ inputs.arch }}
          cpus: '2'
          memory-gib: '8'
          run: |
            export PATH="/src/.ci/readers:$PATH"
            export KUASAR_RUNTIME_READER=/src/.ci/readers/runtime-payloads.py
            /usr/bin/time -o /src/.ci/build-time.txt -f 'build wall_seconds=%e' \
              python3 -B /inputs/release/ci/integration/build-artifacts.py --materialized \
              --plan /src/.ci/plan.json --arch "$TARGET_ARCH" --assets /src/.ci/assets \
              --sources /src --output /src/.ci/delta
      - name: Transport original baseline bytes and the built delta
        run: |
          cp sources/.ci/build-time.txt build-time.txt
          mv sources/.ci/delta delta
          tar -czf build-inputs.tar.gz assets delta build-time.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-build-${{ inputs.arch }}-${{ github.run_id }}
          path: build-inputs.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  prepare:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: build
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      TARGET_ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ inputs.framework_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan_artifact }}
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-build-${{ inputs.arch }}-${{ github.run_id }}
          path: transport
      - name: Bootstrap archive execution prerequisites
        run: bash framework/ci/hosted/bootstrap.sh --profile artifact-prepare
      - name: Download trusted native archive readers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-readers-${{ inputs.arch }}-${{ github.run_id }}
          path: readers
      - name: Verify and select the prebuilt archive readers
        run: |
          (cd readers && sha256sum --check SHA256SUMS)
          chmod 0755 readers/mkfs.erofs readers/fsck.erofs readers/dump.erofs
          echo "$GITHUB_WORKSPACE/readers" >> "$GITHUB_PATH"
          echo "KUASAR_RUNTIME_READER=$GITHUB_WORKSPACE/readers/runtime-payloads.py" >> "$GITHUB_ENV"
      - name: Prepare a runtime without Go, Rust or component sources
        if: needs.build.outputs.product_cases == 'true'
        run: |
          docker build --file framework/ci/hosted/e2e-runtime.Dockerfile \
            --tag "kuasar-e2e-prepare:${GITHUB_RUN_ID}-${TARGET_ARCH}" framework/ci/hosted
          image=$(docker image inspect --format '{{.Id}}' "kuasar-e2e-prepare:${GITHUB_RUN_ID}-${TARGET_ARCH}")
          echo "KUASAR_CLEAN_PREPARE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Compose and prepare this architecture once
        run: |
          python3 -B framework/ci/integration/transport.py extract transport/build-inputs.tar.gz inputs
          clean=()
          if [ -n "${KUASAR_CLEAN_PREPARE_IMAGE:-}" ]; then clean=(--clean-image "$KUASAR_CLEAN_PREPARE_IMAGE"); fi
          /usr/bin/time -o prepare-time.txt -f 'prepare wall_seconds=%e' \
            python3 -B framework/ci/integration/prepare-artifacts.py "${clean[@]}" --plan plan/plan.json \
            --arch "$TARGET_ARCH" --assets inputs/assets --delta inputs/delta --workspace "prepared/$TARGET_ARCH"
          cp inputs/build-time.txt build-time.txt
          tar -czf prepared.tar.gz -C prepared "$TARGET_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-prepared-${{ inputs.arch }}-${{ github.run_id }}
          path: prepared.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-provenance-${{ inputs.arch }}-${{ github.run_id }}
          path: |
            prepared/${{ inputs.arch }}/provenance.json
            build-time.txt
            prepare-time.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  e2e:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: [build, prepare]
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    concurrency:
      group: artifact-e2e-${{ github.repository }}-${{ github.run_id }}-${{ inputs.arch }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      TARGET_ARCH: ${{ inputs.arch }}
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out only the trusted executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ inputs.framework_sha }}
          path: framework
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ci/hosted/
            /ci/integration/
            /release/tag_sources.py
            /release/selection.py
            /test/e2e/package_inputs.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan_artifact }}
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-prepared-${{ inputs.arch }}-${{ github.run_id }}
          path: transport
      - name: Bootstrap declared native execution profile
        run: |
          profile=artifact-x86
          if [ "$TARGET_ARCH" = aarch64 ]; then profile=artifact-arm; fi
          bash framework/ci/hosted/bootstrap.sh --profile "$profile"
      - name: Download trusted native archive readers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-readers-${{ inputs.arch }}-${{ github.run_id }}
          path: readers
      - name: Verify and select the prebuilt archive readers
        run: |
          (cd readers && sha256sum --check SHA256SUMS)
          chmod 0755 readers/mkfs.erofs readers/fsck.erofs readers/dump.erofs
          echo "$GITHUB_WORKSPACE/readers" >> "$GITHUB_PATH"
          echo "KUASAR_RUNTIME_READER=$GITHUB_WORKSPACE/readers/runtime-payloads.py" >> "$GITHUB_ENV"
      - name: Prepare an isolated runtime without Go, Rust or component sources
        if: matrix.shard == 'storage' || matrix.shard == 'snapshot' || (inputs.arch == 'aarch64' && matrix.shard == 'image')
        run: |
          docker build --file framework/ci/hosted/e2e-runtime.Dockerfile \
            --tag "kuasar-e2e-runtime:${GITHUB_RUN_ID}-${TARGET_ARCH}-${TEST_SHARD}" framework/ci/hosted
          image=$(docker image inspect --format '{{.Id}}' "kuasar-e2e-runtime:${GITHUB_RUN_ID}-${TARGET_ARCH}-${TEST_SHARD}")
          echo "KUASAR_CLEAN_E2E_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Run selected cases from immutable prepared inputs
        run: |
          python3 -B framework/ci/integration/transport.py extract transport/prepared.tar.gz prepared
          clean=()
          if [ -n "${KUASAR_CLEAN_E2E_IMAGE:-}" ]; then clean=(--clean-image "$KUASAR_CLEAN_E2E_IMAGE"); fi
          python3 -B framework/ci/integration/run-artifact-tests.py "${clean[@]}" --plan plan/plan.json \
            --arch "$TARGET_ARCH" --shard "$TEST_SHARD" --workspace "prepared/$TARGET_ARCH" \
            --result "results/$TEST_SHARD.json"
      - name: Upload exact shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-shard-${{ inputs.arch }}-${{ matrix.shard }}-${{ github.run_id }}
          path: results/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  performance:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository && needs.build.outputs.performance == 'true'
    needs: [build, prepare]
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      TARGET_ARCH: ${{ inputs.arch }}
    steps:
      - name: Check out only the trusted executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ inputs.framework_sha }}
          path: framework
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ci/hosted/
            /ci/integration/
            /release/tag_sources.py
            /release/selection.py
            /test/e2e/package_inputs.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan_artifact }}
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-prepared-${{ inputs.arch }}-${{ github.run_id }}
          path: transport
      - name: Bootstrap declared native execution profile
        run: |
          profile=artifact-x86
          if [ "$TARGET_ARCH" = aarch64 ]; then profile=artifact-arm; fi
          bash framework/ci/hosted/bootstrap.sh --profile "$profile"
      - name: Download trusted native archive readers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-readers-${{ inputs.arch }}-${{ github.run_id }}
          path: readers
      - name: Verify and select the prebuilt archive readers
        run: |
          (cd readers && sha256sum --check SHA256SUMS)
          chmod 0755 readers/mkfs.erofs readers/fsck.erofs readers/dump.erofs
          echo "$GITHUB_WORKSPACE/readers" >> "$GITHUB_PATH"
          echo "KUASAR_RUNTIME_READER=$GITHUB_WORKSPACE/readers/runtime-payloads.py" >> "$GITHUB_ENV"
      - name: Run the independent working-set performance gate
        run: |
          python3 -B framework/ci/integration/transport.py extract transport/prepared.tar.gz prepared
          python3 -B framework/ci/integration/run-artifact-performance.py --plan plan/plan.json \
            --arch "$TARGET_ARCH" --workspace "prepared/$TARGET_ARCH" \
            --result "results/performance.json"
      - name: Upload independent performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-shard-${{ inputs.arch }}-performance-${{ github.run_id }}
          path: results/performance.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  result:
    if: always() && github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: [build, prepare, e2e, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_ARCH: ${{ inputs.arch }}
    steps:
      - name: Require successful build, preparation and every selected shard
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          PERFORMANCE_REQUIRED: ${{ needs.build.outputs.performance }}
        run: |
          test "$BUILD_RESULT/$PREPARE_RESULT/$E2E_RESULT" = success/success/success
          if [ "$PERFORMANCE_REQUIRED" = true ]; then
            test "$PERFORMANCE_RESULT" = success
          else
            test "$PERFORMANCE_RESULT" = skipped
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ inputs.framework_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan_artifact }}
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-shard-${{ inputs.arch }}-*-${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Explicitly collect this architecture's shards
        run: |
          mkdir results
          python3 -B framework/ci/integration/artifacts.py shard-results \
            --plan plan/plan.json --arch "$TARGET_ARCH" --results shards > "results/$TARGET_ARCH.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-architecture-result-${{ inputs.arch }}-${{ github.run_id }}
          path: results/${{ inputs.arch }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
