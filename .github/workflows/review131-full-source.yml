name: Reviewed main complete source qualification
'on':
  push:
    branches:
    - ci/review131-latest
    paths:
    - .github/workflows/review131-full-source.yml
permissions:
  contents: read
concurrency:
  group: reviewed-main-full-source-qualification
  cancel-in-progress: true
jobs:
  full-source-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KUASAR_HOSTED: 'true'
      TARGET_ARCH: x86_64
      CANDIDATE_REPOSITORY: kuasar-sandbox/kuasar-sandbox
      KUASAR_CI_DIR: ${{ github.workspace }}/ci-metrics
      KUASAR_CI_TIMINGS: ${{ github.workspace }}/ci-metrics/timings.tsv
      KUASAR_NATIVE_CACHE_METRICS: ${{ github.workspace }}/ci-metrics/native-cache.tsv
      KUASAR_REVISION_MANIFEST: ${{ github.workspace }}/ci-metrics/revisions.tsv
    steps:
    - name: Read exact reviewed public main candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ad655ac2603b9c8bcf83d064d673519fb6591ce4
        path: src/platform
        persist-credentials: false
    - name: Prepare standard source host from the reviewed candidate
      run: bash src/platform/ci/hosted/bootstrap.sh --profile source
    - name: Read-only token for the main aggregate source set
      id: source-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
        private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
        owner: kuasar-sandbox
        repositories: accelerator,connector,guest-runtime,orchestrator,sandboxer
        permission-contents: read
        skip-token-revoke: true
    - name: Read exact aggregate dependency accelerator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kuasar-sandbox/accelerator
        ref: f6c84716969d453242c7555fe6c1298ef0249592
        path: src/accelerator
        token: ${{ steps.source-token.outputs.token }}
        persist-credentials: false
    - name: Read exact aggregate dependency connector
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kuasar-sandbox/connector
        ref: 6ae635f0ccd709853288d8176c0e5f35c23e56d3
        path: src/connector
        token: ${{ steps.source-token.outputs.token }}
        persist-credentials: false
    - name: Read exact aggregate dependency guest-runtime
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kuasar-sandbox/guest-runtime
        ref: cec7832127e5c3f83784f72e6138bfcbdb21ad1a
        path: src/guest-runtime
        token: ${{ steps.source-token.outputs.token }}
        persist-credentials: false
    - name: Read exact aggregate dependency orchestrator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kuasar-sandbox/orchestrator
        ref: 5bf9e8b1cd93181b30b4cdac3d36097c2898a2d1
        path: src/orchestrator
        token: ${{ steps.source-token.outputs.token }}
        persist-credentials: false
    - name: Read exact aggregate dependency sandboxer
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kuasar-sandbox/sandboxer
        ref: 2ac1c41c9815388140a53dde1220c361fce6e717
        path: src/sandboxer
        token: ${{ steps.source-token.outputs.token }}
        persist-credentials: false
    - name: Revoke source token before executing candidate code
      if: ${{ always() && steps.source-token.outputs.token != '' }}
      env:
        GH_TOKEN: ${{ steps.source-token.outputs.token }}
      run: "set -euo pipefail\nstatus=$(curl --show-error --silent \\\n  --retry 4 --retry-all-errors --connect-timeout\
        \ 10 --max-time 60 \\\n  --request DELETE --output /dev/null --write-out '%{http_code}' \\\n  -H \"Accept:\
        \ application/vnd.github+json\" \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"X-GitHub-Api-Version:\
        \ 2022-11-28\" \\\n  https://api.github.com/installation/token)\ncase \"$status\" in 204|401) ;; *) echo\
        \ \"failed to revoke source token: HTTP $status\" >&2; exit 1 ;; esac\n"
    - name: Validate the exact source set and initialize workspace
      run: 'set -euo pipefail

        mkdir -p "$KUASAR_CI_DIR"

        printf ''repository\trequested_ref\tresolved_sha\trole\n'' > "$KUASAR_REVISION_MANIFEST"

        test "$(git -C src/platform rev-parse HEAD)" = ad655ac2603b9c8bcf83d064d673519fb6591ce4

        printf ''%s\t%s\t%s\t%s\n'' kuasar-sandbox ad655ac2603b9c8bcf83d064d673519fb6591ce4 ad655ac2603b9c8bcf83d064d673519fb6591ce4
        reviewed-source-rehearsal >> "$KUASAR_REVISION_MANIFEST"

        test "$(git -C src/accelerator rev-parse HEAD)" = f6c84716969d453242c7555fe6c1298ef0249592

        printf ''%s\t%s\t%s\t%s\n'' accelerator f6c84716969d453242c7555fe6c1298ef0249592 f6c84716969d453242c7555fe6c1298ef0249592
        reviewed-source-rehearsal >> "$KUASAR_REVISION_MANIFEST"

        test "$(git -C src/connector rev-parse HEAD)" = 6ae635f0ccd709853288d8176c0e5f35c23e56d3

        printf ''%s\t%s\t%s\t%s\n'' connector 6ae635f0ccd709853288d8176c0e5f35c23e56d3 6ae635f0ccd709853288d8176c0e5f35c23e56d3
        reviewed-source-rehearsal >> "$KUASAR_REVISION_MANIFEST"

        test "$(git -C src/guest-runtime rev-parse HEAD)" = cec7832127e5c3f83784f72e6138bfcbdb21ad1a

        printf ''%s\t%s\t%s\t%s\n'' guest-runtime cec7832127e5c3f83784f72e6138bfcbdb21ad1a cec7832127e5c3f83784f72e6138bfcbdb21ad1a
        reviewed-source-rehearsal >> "$KUASAR_REVISION_MANIFEST"

        test "$(git -C src/orchestrator rev-parse HEAD)" = 5bf9e8b1cd93181b30b4cdac3d36097c2898a2d1

        printf ''%s\t%s\t%s\t%s\n'' orchestrator 5bf9e8b1cd93181b30b4cdac3d36097c2898a2d1 5bf9e8b1cd93181b30b4cdac3d36097c2898a2d1
        reviewed-source-rehearsal >> "$KUASAR_REVISION_MANIFEST"

        test "$(git -C src/sandboxer rev-parse HEAD)" = 2ac1c41c9815388140a53dde1220c361fce6e717

        printf ''%s\t%s\t%s\t%s\n'' sandboxer 2ac1c41c9815388140a53dde1220c361fce6e717 2ac1c41c9815388140a53dde1220c361fce6e717
        reviewed-source-rehearsal >> "$KUASAR_REVISION_MANIFEST"

        cd src

        go work init ./accelerator ./connector ./guest-runtime ./orchestrator ./sandboxer'
    - name: Initialize source qualification metadata
      run: |
        set -euo pipefail
        mkdir -p "$KUASAR_CI_DIR"
        # Match the production run.tsv schema; this rehearsal tests the reviewed
        # head itself, not an invented PR integration commit.
        candidate_sha="$(git -C src/platform rev-parse HEAD)"
        printf 'mode\tcandidate_repository\tpull_request\tcandidate_sha\tbase_sha\tbase_ref\thead_sha\trelease_version\n' > "$KUASAR_CI_DIR/run.tsv"
        printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
          source "$CANDIDATE_REPOSITORY" 140 "$candidate_sha" \
          b52103b71e88274a636dc615823d0dfeb04f5aa1 main "$candidate_sha" '' \
          >> "$KUASAR_CI_DIR/run.tsv"
        cat "$KUASAR_CI_DIR/run.tsv"
    - name: Pull standard runner test images
      run: "set -euo pipefail\nfor image in python:3.12-slim python:3.12-alpine busybox:latest;\
        \ do\n  timeout 3m docker pull \"$image\"\ndone\n"
    - name: Attach job-local source caches and test tools
      run: "set -euo pipefail\nfor path in \\\n  src/accelerator/build/tarball \\\n  src/guest-runtime/native-deps/build/tarball\
        \ \\\n  src/sandboxer/native-deps/build/tarball\ndo\n  mkdir -p \"$(dirname \"$path\")\"\n  ln -sfn \"$KUASAR_TARBALL_CACHE\"\
        \ \"$path\"\ndone\n# make e2e-tools builds/downloads the existing pinned tool inputs.\n# Never link the\
        \ persistent runner's preinstalled tools on hosted.\ntool_dir=\"$GITHUB_WORKSPACE/src/platform/build/e2e-tools/x86_64\"\
        \nmkdir -p \"$tool_dir\"\necho \"E2E_ZOT_BIN=$tool_dir/zot\" >> \"$GITHUB_ENV\"\necho \"E2E_VGW_BIN=$tool_dir/versitygw\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Restore or build verified native artifacts
      working-directory: src/platform
      shell: bash
      run: "if [ \"${KUASAR_HOSTED:-false}\" = true ]; then\n  taskset -pc \"$KUASAR_BUILD_CPUS\" \"$$\" >/dev/null\n\
        fi\nci/native-cache/native-cache.sh restore-or-build\n"
    - name: Validate platform tooling
      working-directory: src/platform
      shell: bash
      run: "if [ \"${KUASAR_HOSTED:-false}\" = true ]; then\n  taskset -pc \"$KUASAR_BUILD_CPUS\" \"$$\" >/dev/null\n\
        fi\nmake -j3 test-ci-tools test-release-tools test-perf-tools\n"
    - name: Build and test source candidate
      working-directory: src/platform
      shell: bash
      run: "if [ \"${KUASAR_HOSTED:-false}\" = true ]; then\n  taskset -pc \"$KUASAR_BUILD_CPUS\" \"$$\" >/dev/null\n\
        fi\nset -euo pipefail\nmake build e2e-tools assemble-e2e\nif [ \"$KUASAR_HOSTED\" = true ]; then\n  [ -x\
        \ \"$E2E_ZOT_BIN\" ] && [ -x \"$E2E_VGW_BIN\" ]\nfi\nmake test-uffd-performance-gate\n\nowner=\"${CANDIDATE_REPOSITORY##*/}\"\
        \nrunner=\"build/e2e-suite/test/e2e/$owner/run_all.sh\"\nif [ \"$owner\" = kuasar-sandbox ]; then\n  runner=build/e2e-suite/test/e2e/run_all.sh\n\
        fi\n[ -x \"$runner\" ] \\\n  || { echo \"missing E2E runner for candidate owner $owner: $runner\" >&2; exit\
        \ 1; }\n\nci/integration/ci-timed.sh \"e2e/$owner\" env \\\n  BIN=\"$PWD/bin/x86_64\" \\\n  ZOT_BIN=\"$E2E_ZOT_BIN\"\
        \ \\\n  VGW_BIN=\"$E2E_VGW_BIN\" \\\n  bash \"$runner\"\n"
    - name: Run working-set performance smoke
      working-directory: src/platform
      env:
        PERF_ITERS: '1'
        PERF_OUT_DIR: ${{ env.KUASAR_CI_DIR }}/working-set-perf
      run: "ci/integration/ci-timed.sh perf/working-set-smoke env \\\n  BIN=\"$PWD/bin/x86_64\" \\\n  PERF_ITERS=\"\
        $PERF_ITERS\" \\\n  PERF_OUT_DIR=\"$PERF_OUT_DIR\" \\\n  bash test/perf/working-set-netns.sh test/perf/sandbox-perf-working-set.sh\n"
    - name: Record actual source-set timing and resource evidence
      if: always()
      run: free -m; df -h .; test ! -f "$KUASAR_CI_TIMINGS" || cat "$KUASAR_CI_TIMINGS"; test ! -f "$KUASAR_REVISION_MANIFEST"
        || cat "$KUASAR_REVISION_MANIFEST"
    - name: Package and validate the exact tested unpublished products
      run: "set -euo pipefail\n# Build no replacements here: package the exact products already built/tested.\n\
        workspace=\"$GITHUB_WORKSPACE\"\nstage=\"$RUNNER_TEMP/main-staged-products\"\n# Official package entry points\
        \ require the same selected component versions\n# as this unpublished staging manifest; their source SHAs\
        \ remain real commits.\nexport RELEASE_ACCELERATOR_VERSION=v0.1.5-preview.20260918.9999\nexport RELEASE_CONNECTOR_VERSION=v0.1.5-preview.20260918.9999\n\
        export RELEASE_SANDBOXER_VERSION=v0.1.5-preview.20260918.9999\nmkdir -p \"$stage/fetched/components\" \"\
        $stage/fetched/sources\" \"$stage/fetched/updates\"\nfor repo in accelerator connector sandboxer orchestrator;\
        \ do\n  version=v0.1.5-preview.20260918.9999\n  dir=\"$workspace/src/$repo\"\n  test -z \"$(git -C \"$dir\"\
        \ status --porcelain --untracked-files=no)\"\n  (cd \"$dir\" && SOURCE_DATE_EPOCH=\"$(git show -s --format=%ct\
        \ HEAD)\" \\\n    bash scripts/release.sh package \"$version\" x86_64 \"$stage/packages/$repo\")\n  (cd\
        \ \"$dir\" && bash scripts/release.sh validate \"$version\" x86_64 \"$stage/packages/$repo\")\n  mkdir -p\
        \ \"$stage/fetched/components/$repo\"\n  cp \"$stage/packages/$repo/assets/\"* \"$stage/fetched/components/$repo/\"\
        \n  ln -s \"$dir\" \"$stage/fetched/sources/$repo\"\n  printf 'Unpublished qualification only. Exact source:\
        \ `%s`.\\n' \"$(git -C \"$dir\" rev-parse HEAD)\" > \"$stage/fetched/updates/$repo.md\"\ndone\nfor unit\
        \ in runtime vmlinux; do\n  version=runtime-v0.1.5-preview.20260918.9999\n  test \"$unit\" != vmlinux ||\
        \ version=vmlinux-v0.1.3-preview.20260918.9999\n  dir=\"$workspace/src/guest-runtime\"\n  (cd \"$dir\" &&\
        \ SOURCE_SHA=\"$(git rev-parse HEAD)\" SOURCE_DATE_EPOCH=\"$(git show -s --format=%ct HEAD)\" \\\n    bash\
        \ scripts/release.sh package \"$unit\" \"$version\" x86_64 \"$stage/packages/$unit\")\n  (cd \"$dir\" &&\
        \ SOURCE_SHA=\"$(git rev-parse HEAD)\" bash scripts/release.sh validate \"$unit\" \"$version\" x86_64 \"\
        $stage/packages/$unit\")\n  mkdir -p \"$stage/fetched/components/$unit\"\n  cp \"$stage/packages/$unit/assets/\"\
        * \"$stage/fetched/components/$unit/\"\n  ln -s \"$dir\" \"$stage/fetched/sources/$unit\"\n  printf 'Unpublished\
        \ qualification only. Exact source: `%s`.\\n' \"$(git -C \"$dir\" rev-parse HEAD)\" > \"$stage/fetched/updates/$unit.md\"\
        \ndone\n# This isolated manifest is a staged candidate, not a tag or a published release.\nmkdir -p \"$stage/platform-input\"\
        \ngit -C \"$workspace/src/platform\" archive HEAD | tar -x -C \"$stage/platform-input\"\npython3 - \"$stage/platform-input/releases/daily-preview.yaml\"\
        \ <<'PY'\nimport pathlib, sys\npathlib.Path(sys.argv[1]).write_text('''version: release-v0.1.5\npreview_version:\
        \ preview.20260918.9999\ncomponents:\n  accelerator: v0.1.5-preview.20260918.9999\n  connector: v0.1.5-preview.20260918.9999\n\
        \  sandboxer: v0.1.5-preview.20260918.9999\n  orchestrator: v0.1.5-preview.20260918.9999\n  runtime: runtime-v0.1.5-preview.20260918.9999\n\
        \  vmlinux: vmlinux-v0.1.3-preview.20260918.9999\n''')\nPY\nexport PLATFORM_SOURCE_ROOT=\"$stage/platform-input\"\
        \nversion=release-v0.1.5-preview.20260918.9999\nsource \"$workspace/src/platform/release/lib.sh\"\nresolve_selection\
        \ \"$PLATFORM_SOURCE_ROOT\" \"$version\" \"$stage/fetched/selection.tsv\"\n: > \"$stage/fetched/previous-selection.tsv\"\
        \nbash \"$workspace/src/platform/release/aggregate-release.sh\" assemble \"$version\" \"$stage/fetched\"\
        \ \"$stage/bundle\"\nbash \"$workspace/src/platform/release/aggregate-release.sh\" validate \"$version\"\
        \ \"$stage/bundle\"\nmkdir -p \"$stage/bundle/platform-config/releases\"\ncp \"$PLATFORM_SOURCE_ROOT/releases/release.yaml\"\
        \ \"$PLATFORM_SOURCE_ROOT/releases/daily-preview.yaml\" \"$stage/bundle/platform-config/releases/\"\ncp\
        \ \"$KUASAR_REVISION_MANIFEST\" \"$stage/bundle/source-revisions.tsv\"\nprintf 'Unpublished exact-source\
        \ qualification; no remote tags/releases created.\\n' > \"$stage/bundle/QUALIFICATION.txt\"\nprintf 'STAGED_BUNDLE=%s\\\
        n' \"$stage/bundle\" >> \"$GITHUB_ENV\"\n"
    - name: Transfer only validated candidate release bundles
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: review131-staged-products
        path: ${{ env.STAGED_BUNDLE }}
        retention-days: 1
        if-no-files-found: error
  staged-exact-assets:
    name: staged-exact-assets [${{ matrix.shard }}]
    needs: full-source-e2e
    strategy:
      fail-fast: false
      matrix:
        shard: [core, sandboxer, orchestrator]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KUASAR_CI_DIR: ${{ github.workspace }}/exact-evidence
      KUASAR_REVISION_MANIFEST: ${{ github.workspace }}/staged-bundle/source-revisions.tsv
      KUASAR_E2E_SHARD: ${{ matrix.shard }}
    steps:
    - name: Read reviewed public validation tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ad655ac2603b9c8bcf83d064d673519fb6591ce4
        path: trusted/platform
        persist-credentials: false
    - name: Initialize exact-assets qualification metadata
      run: |
        set -euo pipefail
        mkdir -p "$KUASAR_CI_DIR"
        # Explicit binary-only mode, even alongside public validation tooling.
        printf 'mode\tcandidate_repository\tpull_request\tcandidate_sha\tbase_sha\tbase_ref\thead_sha\trelease_version\n' > "$KUASAR_CI_DIR/run.tsv"
        printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
          exact-assets '' 0 '' '' '' '' release-v0.1.5-preview.20260918.9999 \
          >> "$KUASAR_CI_DIR/run.tsv"
        cat "$KUASAR_CI_DIR/run.tsv"
    - name: Prepare a fresh exact-assets host
      run: bash trusted/platform/ci/hosted/bootstrap.sh --profile exact-assets
    - name: Receive the successful source job candidate bundles
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: review131-staged-products
        path: staged-bundle
    - name: Validate and extract the unpublished exact bundle
      run: 'set -euo pipefail

        export PLATFORM_SOURCE_ROOT="$PWD/staged-bundle/platform-config"

        bash trusted/platform/release/aggregate-release.sh validate release-v0.1.5-preview.20260918.9999 staged-bundle

        bash trusted/platform/release/aggregate-release.sh extract release-v0.1.5-preview.20260918.9999 staged-bundle
        release-install

        sha256sum release-install/bin/* > "$RUNNER_TEMP/products-before.sha256"'
    - name: Prepare pinned auxiliary tools only
      run: bash trusted/platform/ci/hosted/exact-assets-tools.sh
    - name: Pull standard runner test images
      run: "set -euo pipefail\nfor image in python:3.12-slim python:3.12-alpine busybox:latest;\
        \ do\n  timeout 3m docker pull \"$image\"\ndone\n"
    - name: Run every required test from the validated staged package
      working-directory: release-install
      env:
        BIN: ${{ github.workspace }}/release-install/bin
        ZOT_BIN: ${{ env.E2E_ZOT_BIN }}
        VGW_BIN: ${{ env.E2E_VGW_BIN }}
        REQUIRE_KVM: '1'
        REQUIRE_EXEC: '1'
        REQUIRE_CLUSTER_STUB: '1'
        REQUIRE_CLUSTER_REAL: '1'
        REQUIRE_ORCH: '1'
        REQUIRE_PROXY: '1'
        REQUIRE_BUILDER: '1'
        REQUIRE_RUNTASK: '1'
        REQUIRE_CONNECTOR_E2E: '1'
        REQUIRE_GUEST_RUNTIME: '1'
      run: bash test/e2e/run_all.sh
    - name: Verify product bytes remained unchanged
      if: always()
      run: test ! -f "$RUNNER_TEMP/products-before.sha256" || sha256sum -c "$RUNNER_TEMP/products-before.sha256"
