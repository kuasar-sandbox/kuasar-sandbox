name: Issue 191 isolated platform edit
on:
  push:
    branches: [work/sandboxer-191-cleanup]
permissions:
  contents: write
jobs:
  edit:
    if: github.repository == 'kuasar-sandbox/kuasar-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sandboxer-191-disk-config
          fetch-depth: 0
      - name: Remove retired disk size keys from working-set configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ce68494e299641613d16d269330df6cc7d2928ef
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('test/perf/sandbox-perf-working-set.sh')
          text = p.read_text()
          for key in [', diff_size: 512MiB', ', size: 512MiB', ', size: 1GiB']:
              assert text.count(key) == 2, (key, text.count(key))
              text = text.replace(key, '')
          p.write_text(text)
          subprocess.check_call(['bash', '-n', str(p)])
          subprocess.check_call(['git', 'diff', '--check'])
          subprocess.check_call(['git', 'diff', '--', str(p)])
          r = subprocess.run(['git', 'grep', '-n', '-E', r'diff_size|overlay:.*\bsize:', '--', 'test/perf'], text=True, capture_output=True)
          assert r.returncode == 1, r.stdout + r.stderr
          subprocess.check_call(['make', 'test-perf-tools'])
          subprocess.check_call(['git', 'add', '--', str(p)])
          subprocess.check_call(['git', 'commit', '-m', 'fix(perf): stop generating ineffective disk-size settings'])
          subprocess.check_call(['git', 'push', 'origin', 'HEAD:refs/heads/fix/sandboxer-191-disk-config'])
          PY
