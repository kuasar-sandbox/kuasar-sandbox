name: Reusable BMS E2E

on:
  workflow_call:
    inputs:
      mode:
        description: source or exact-assets
        required: true
        type: string
      candidate_repository:
        description: Repository whose source candidate is under test
        required: false
        default: ""
        type: string
      pull_request_number:
        description: Pull request whose integration commit is under test; zero for a main push
        required: false
        default: "0"
        type: string
      candidate_sha:
        description: Exact source integration or main commit
        required: false
        default: ""
        type: string
      base_sha:
        description: Integration commit first parent
        required: false
        default: ""
        type: string
      head_sha:
        description: Integration commit second parent
        required: false
        default: ""
        type: string
      release_version:
        description: Aggregate release-v* version for exact-assets mode
        required: false
        default: ""
        type: string
      release_bundle_artifact:
        description: Current-run artifact containing the exact aggregate bundle
        required: false
        default: ""
        type: string
    secrets:
      KUASAR_CI_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reusable-bms-${{ inputs.mode }}-${{ inputs.candidate_repository || inputs.release_version }}-${{ inputs.candidate_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
      CANDIDATE_PR: ${{ inputs.pull_request_number }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BASE_SHA: ${{ inputs.base_sha }}
      CANDIDATE_HEAD_SHA: ${{ inputs.head_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_BUNDLE_ARTIFACT: ${{ inputs.release_bundle_artifact }}
    steps:
      - name: Validate reusable workflow request
        env:
          TRUSTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [ "$TRUSTED_WORKFLOW_REPOSITORY" = kuasar-sandbox/platform ] \
            || { echo "BMS implementation must come from kuasar-sandbox/platform" >&2; exit 1; }
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "${{ inputs.mode }}" in
            source)
              [[ "$CANDIDATE_REPOSITORY" =~ ^kuasar-sandbox/(accelerator|connector|guest-runtime|orchestrator|platform|sandboxer)$ ]]
              for variable in CANDIDATE_SHA CANDIDATE_BASE_SHA CANDIDATE_HEAD_SHA; do
                value=${!variable}
                [[ "$value" =~ ^[0-9a-f]{40}$ ]] \
                  || { echo "$variable must be a full lowercase commit SHA" >&2; exit 1; }
              done
              [[ "$CANDIDATE_PR" =~ ^[0-9]+$ ]]

              case "$GITHUB_EVENT_NAME" in
                pull_request_target)
                  jq -e \
                    --arg repository "$CANDIDATE_REPOSITORY" \
                    --argjson number "$CANDIDATE_PR" \
                    --arg base "$CANDIDATE_BASE_SHA" \
                    --arg head "$CANDIDATE_HEAD_SHA" '
                      .repository.full_name == $repository
                      and .pull_request.number == $number
                      and .pull_request.state == "open"
                      and .pull_request.draft == false
                      and .pull_request.base.ref == "main"
                      and .pull_request.base.repo.full_name == $repository
                      and .pull_request.base.sha == $base
                      and .pull_request.head.sha == $head
                    ' "$GITHUB_EVENT_PATH" >/dev/null \
                    || { echo "pull_request_target inputs do not match the admitted event" >&2; exit 1; }
                  ;;
                push)
                  [ "$GITHUB_REF" = refs/heads/main ]
                  [ "$CANDIDATE_REPOSITORY" = "$GITHUB_REPOSITORY" ]
                  [ "$CANDIDATE_PR" = 0 ]
                  [ "$CANDIDATE_SHA" = "$GITHUB_SHA" ]
                  [ "$CANDIDATE_BASE_SHA" = "$GITHUB_SHA" ]
                  [ "$CANDIDATE_HEAD_SHA" = "$GITHUB_SHA" ]
                  ;;
                workflow_dispatch) ;;
                *) echo "source BMS rejects event $GITHUB_EVENT_NAME" >&2; exit 1 ;;
              esac
              ;;
            exact-assets)
              [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
                || { echo "exact-assets BMS requires workflow_dispatch" >&2; exit 1; }
              [[ "$RELEASE_VERSION" =~ ^release-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[0-9]{8})?$ ]]
              [[ "$RELEASE_BUNDLE_ARTIFACT" =~ ^aggregate-stage-release-v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]{8})?-[0-9]+$ ]]
              ;;
            *) echo "mode must be source or exact-assets" >&2; exit 1 ;;
          esac

  e2e:
    needs: request
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
      - kvm
      - cgroup-v2
    timeout-minutes: ${{ inputs.mode == 'exact-assets' && 120 || 45 }}
    env:
      TARGET_ARCH: x86_64
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      KUASAR_CI_DIR: ${{ github.workspace }}/ci-metrics/${{ github.run_id }}-${{ github.run_attempt }}
      KUASAR_CI_TIMINGS: ${{ github.workspace }}/ci-metrics/${{ github.run_id }}-${{ github.run_attempt }}/timings.tsv
      KUASAR_NATIVE_CACHE_METRICS: ${{ github.workspace }}/ci-metrics/${{ github.run_id }}-${{ github.run_attempt }}/native-cache.tsv
      KUASAR_REVISION_MANIFEST: ${{ github.workspace }}/ci-metrics/${{ github.run_id }}-${{ github.run_attempt }}/revisions.tsv
      KUASAR_SOURCE_CACHE_MAX_ENTRIES: "32"
      KUASAR_NATIVE_CACHE_MAX_ENTRIES: "4"
      CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
      CANDIDATE_PR: ${{ inputs.pull_request_number }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BASE_SHA: ${{ inputs.base_sha }}
      CANDIDATE_HEAD_SHA: ${{ inputs.head_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_BUNDLE_ARTIFACT: ${{ inputs.release_bundle_artifact }}

    steps:
      - name: Initialize CI metadata
        run: |
          set -euo pipefail
          rm -rf "${KUASAR_CI_DIR%/*}"
          mkdir -p "$KUASAR_CI_DIR"
          printf 'mode\tcandidate_repository\tpull_request\tcandidate_sha\tbase_sha\thead_sha\trelease_version\n' \
            > "$KUASAR_CI_DIR/run.tsv"
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "${{ inputs.mode }}" "$CANDIDATE_REPOSITORY" "$CANDIDATE_PR" "$CANDIDATE_SHA" \
            "$CANDIDATE_BASE_SHA" "$CANDIDATE_HEAD_SHA" "$RELEASE_VERSION" \
            >> "$KUASAR_CI_DIR/run.tsv"

      - name: Reset interrupted E2E state
        run: |
          set -euo pipefail
          privileged=()
          if [ "$(id -u)" -ne 0 ]; then privileged=(sudo -n); fi
          "${privileged[@]}" systemctl stop 'sandbox-runner@*.service' 'sandbox-builder@*.service'
          if ip link show sb-tap0 >/dev/null 2>&1; then
            "${privileged[@]}" ip link del sb-tap0
          fi
          "${privileged[@]}" rm -f \
            /run/systemd/system/sandbox-runner@.service \
            /run/systemd/system/sandbox-builder@.service \
            /run/systemd/system/sandbox-runner.slice \
            /run/systemd/system/sandbox-builder.slice
          "${privileged[@]}" systemctl reset-failed 'sandbox-runner@*.service' 'sandbox-builder@*.service'
          "${privileged[@]}" systemctl daemon-reload

      - name: Create read-only platform tooling token
        id: platform-tooling-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: platform
          permission-contents: read

      - name: Check out trusted platform tooling
        id: checkout-platform-tooling
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted/platform
          token: ${{ steps.platform-tooling-token.outputs.token }}
          persist-credentials: false

      - name: Retry trusted platform tooling checkout
        if: steps.checkout-platform-tooling.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted/platform
          token: ${{ steps.platform-tooling-token.outputs.token }}
          persist-credentials: false

      - name: Download exact aggregate bundle
        if: inputs.mode == 'exact-assets'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_bundle_artifact }}
          path: release-bundle

      - name: Validate and extract exact aggregate bundle
        if: inputs.mode == 'exact-assets'
        run: |
          set -euo pipefail
          trusted/platform/release/aggregate-release.sh validate "$RELEASE_VERSION" release-bundle
          rm -rf release-install
          trusted/platform/release/aggregate-release.sh extract \
            "$RELEASE_VERSION" release-bundle release-install

      - name: Create read-only source token
        if: inputs.mode == 'source'
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,orchestrator,platform,sandboxer
          permission-contents: read
          skip-token-revoke: true

      - name: Validate pull request integration commit
        if: inputs.mode == 'source' && inputs.pull_request_number != '0'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          CALLER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(curl --fail --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$CANDIDATE_REPOSITORY/git/commits/$CANDIDATE_SHA")
          jq -e --arg candidate "$CANDIDATE_SHA" --arg base "$CANDIDATE_BASE_SHA" --arg head "$CANDIDATE_HEAD_SHA" '
              .sha == $candidate
              and (.parents | length) == 2
              and .parents[0].sha == $base
              and .parents[1].sha == $head
            ' <<< "$response" >/dev/null \
            || { echo "candidate is not the recorded two-parent PR integration commit" >&2; exit 1; }
          pr=$(curl --fail --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CALLER_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$CANDIDATE_REPOSITORY/pulls/$CANDIDATE_PR")
          jq -e --argjson number "$CANDIDATE_PR" --arg candidate "$CANDIDATE_SHA" \
            --arg base "$CANDIDATE_BASE_SHA" --arg head "$CANDIDATE_HEAD_SHA" '
              .number == $number
              and .state == "open"
              and .base.ref == "main"
              and .base.sha == $base
              and .head.sha == $head
              and .merge_commit_sha == $candidate
            ' <<< "$pr" >/dev/null \
            || { echo "candidate no longer matches the open pull request" >&2; exit 1; }

      - name: Check out executable platform source
        if: inputs.mode == 'source'
        id: checkout-platform-source
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/platform
          ref: ${{ inputs.candidate_repository == 'kuasar-sandbox/platform' && inputs.candidate_sha || job.workflow_sha }}
          path: src/platform
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry executable platform source checkout
        if: inputs.mode == 'source' && steps.checkout-platform-source.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/platform
          ref: ${{ inputs.candidate_repository == 'kuasar-sandbox/platform' && inputs.candidate_sha || job.workflow_sha }}
          path: src/platform
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Assemble the five component source repositories
        if: inputs.mode == 'source'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          repos=(accelerator connector guest-runtime orchestrator sandboxer)
          archive_tmp=""
          checksum_tmp=""
          zip_tmp=""
          zip_stage=""
          trap 'rm -f "${archive_tmp:-}" "${checksum_tmp:-}" "${zip_tmp:-}"; rm -rf "${zip_stage:-}"' EXIT
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          started_ns=$(date +%s%N)
          printf 'repository\trequested_ref\tresolved_sha\trole\n' > "$KUASAR_REVISION_MANIFEST"
          printf 'repository\tresolved_sha\tstatus\tsha256\n' > "$KUASAR_CI_DIR/source-cache.tsv"

          revision_query='
          query {
            accelerator: repository(owner: "kuasar-sandbox", name: "accelerator") { ref(qualifiedName: "refs/heads/main") { target { oid } } }
            connector: repository(owner: "kuasar-sandbox", name: "connector") { ref(qualifiedName: "refs/heads/main") { target { oid } } }
            guest_runtime: repository(owner: "kuasar-sandbox", name: "guest-runtime") { ref(qualifiedName: "refs/heads/main") { target { oid } } }
            orchestrator: repository(owner: "kuasar-sandbox", name: "orchestrator") { ref(qualifiedName: "refs/heads/main") { target { oid } } }
            sandboxer: repository(owner: "kuasar-sandbox", name: "sandboxer") { ref(qualifiedName: "refs/heads/main") { target { oid } } }
          }'
          revision_response=$(jq -cn --arg query "$revision_query" '{query: $query}' \
            | curl --fail --show-error --silent \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- https://api.github.com/graphql)
          jq -e '
            .errors == null and ([
              .data.accelerator.ref.target.oid,
              .data.connector.ref.target.oid,
              .data.guest_runtime.ref.target.oid,
              .data.orchestrator.ref.target.oid,
              .data.sandboxer.ref.target.oid
            ] | all(type == "string" and test("^[0-9a-f]{40}$")))
          ' <<< "$revision_response" >/dev/null \
            || { echo "revision resolution did not return all five component repositories" >&2; exit 1; }

          for repo in "${repos[@]}"; do
            requested_ref=main
            role=sibling
            if [ "kuasar-sandbox/$repo" = "$CANDIDATE_REPOSITORY" ]; then
              requested_ref="$CANDIDATE_SHA"
              resolved_sha="$CANDIDATE_SHA"
              role=candidate
            else
              revision_key=${repo//-/_}
              resolved_sha=$(jq -r --arg key "$revision_key" '.data[$key].ref.target.oid // empty' \
                <<< "$revision_response")
            fi
            [[ "$resolved_sha" =~ ^[0-9a-f]{40}$ ]]
            printf 'kuasar-sandbox/%s\t%s\t%s\t%s\n' \
              "$repo" "$requested_ref" "$resolved_sha" "$role" >> "$KUASAR_REVISION_MANIFEST"

            source_dir="/var/cache/kuasar/sources/$repo"
            archive="$source_dir/$resolved_sha.tar.gz"
            checksum="$archive.sha256"
            lock="$source_dir/.cache.lock"
            install -d -m 0755 "$source_dir"
            exec {source_lock_fd}>"$lock"
            flock "$source_lock_fd"
            cache_status=hit
            if ! [ -s "$archive" ] || ! [ -s "$checksum" ] \
              || ! (cd "$source_dir" && sha256sum --quiet -c "$(basename "$checksum")") \
              || ! tar -tzf "$archive" >/dev/null; then
              cache_status=miss
              archive_tmp="$archive.$$.tmp"
              checksum_tmp="$checksum.$$.tmp"
              zip_tmp="$archive.$$.zip.tmp"
              zip_stage="$source_dir/.zip-stage.$$"
              rm -f "$archive_tmp" "$checksum_tmp" "$zip_tmp"
              rm -rf "$zip_stage"
              if ! curl --fail --show-error --silent --location \
                --retry 4 --retry-all-errors --connect-timeout 10 --max-time 120 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/kuasar-sandbox/$repo/tarball/$resolved_sha" \
                -o "$archive_tmp"; then
                cache_status=miss-zip-fallback
                rm -f "$archive_tmp"
                curl --fail --show-error --silent --location \
                  --retry 4 --retry-all-errors --connect-timeout 10 --max-time 120 \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/kuasar-sandbox/$repo/zipball/$resolved_sha" \
                  -o "$zip_tmp"
                install -d -m 0755 "$zip_stage"
                unzip -q "$zip_tmp" -d "$zip_stage"
                mapfile -d '' zip_roots < <(find "$zip_stage" -mindepth 1 -maxdepth 1 -print0)
                [ "${#zip_roots[@]}" -eq 1 ] && [ -d "${zip_roots[0]}" ]
                tar -czf "$archive_tmp" -C "$zip_stage" "$(basename "${zip_roots[0]}")"
                rm -f "$zip_tmp"
                rm -rf "$zip_stage"
                zip_tmp=""
                zip_stage=""
              fi
              tar -tzf "$archive_tmp" >/dev/null
              archive_sha=$(sha256sum "$archive_tmp" | awk '{print $1}')
              printf '%s  %s\n' "$archive_sha" "$(basename "$archive")" > "$checksum_tmp"
              chmod a-w "$archive_tmp" "$checksum_tmp"
              rm -f "$archive" "$checksum"
              mv "$archive_tmp" "$archive"
              mv "$checksum_tmp" "$checksum"
              archive_tmp=""
              checksum_tmp=""
            fi
            archive_sha=$(sha256sum "$archive" | awk '{print $1}')
            touch "$archive" "$checksum"
            mkdir -p "src/$repo"
            tar -xzf "$archive" --strip-components=1 -C "src/$repo"
            flock -u "$source_lock_fd"
            exec {source_lock_fd}>&-
            printf '%s\t%s\t%s\t%s\n' "$repo" "$resolved_sha" "$cache_status" "$archive_sha" \
              >> "$KUASAR_CI_DIR/source-cache.tsv"
          done

          elapsed=$(awk -v start="$started_ns" -v end="$(date +%s%N)" \
            'BEGIN { printf "%.3f", (end - start) / 1000000000 }')
          printf 'stage\tstarted_at\telapsed_seconds\tuser_seconds\tsystem_seconds\tcpu_percent\tmax_rss_kb\tfs_input\tfs_output\texit_code\n' \
            > "$KUASAR_CI_TIMINGS"
          printf 'workflow/assemble\t%s\t%s\tunavailable\tunavailable\tunavailable\tunavailable\tunavailable\tunavailable\t0\n' \
            "$started_at" "$elapsed" >> "$KUASAR_CI_TIMINGS"

      - name: Revoke source token before executing candidate code
        if: ${{ always() && inputs.mode == 'source' && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request DELETE --output /dev/null --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token)
          case "$status" in 204|401) ;; *) echo "failed to revoke source token: HTTP $status" >&2; exit 1 ;; esac

      - name: Finalize source workspace
        if: inputs.mode == 'source'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r repository _ resolved_sha _; do
            repo=${repository#kuasar-sandbox/}
            source_dir="/var/cache/kuasar/sources/$repo"
            src/platform/ci/bms/source-cache-prune.sh \
              "$source_dir" "$source_dir/$resolved_sha.tar.gz"
          done < <(tail -n +2 "$KUASAR_REVISION_MANIFEST")
          rm -f go.work go.work.sum src/go.work src/go.work.sum
          cd src
          go work init ./accelerator ./connector ./guest-runtime ./orchestrator ./sandboxer

      - name: Attach runner caches and test tools
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = source ]; then
            install -d -m 0755 /var/cache/kuasar/tarballs
            for path in \
              src/accelerator/build/tarball \
              src/guest-runtime/native-deps/build/tarball \
              src/sandboxer/native-deps/build/tarball
            do
              mkdir -p "$(dirname "$path")"
              ln -sfn /var/cache/kuasar/tarballs "$path"
            done
            linux_file=$(awk '/^LINUX_TARBALL[[:space:]]*\?=/ { url=$3; sub(/\\#.*/, "", url); n=split(url, part, "/"); print part[n]; exit }' src/guest-runtime/native-deps/Makefile)
            [[ "$linux_file" =~ ^linux-([0-9]+)\..*\.tar\.gz$ ]]
            echo "LINUX_TARBALL=https://mirrors.tuna.tsinghua.edu.cn/kernel/v${BASH_REMATCH[1]}.x/$linux_file" >> "$GITHUB_ENV"
            tool_dir=src/platform/build/e2e-tools/x86_64
          else
            tool_dir=release-tools
          fi
          mkdir -p "$tool_dir"
          ln -sfn /var/lib/kuasar-ci/tools/zot "$tool_dir/zot"
          ln -sfn /var/lib/kuasar-ci/tools/versitygw "$tool_dir/versitygw"
          echo "E2E_ZOT_BIN=$GITHUB_WORKSPACE/$tool_dir/zot" >> "$GITHUB_ENV"
          echo "E2E_VGW_BIN=$GITHUB_WORKSPACE/$tool_dir/versitygw" >> "$GITHUB_ENV"
          for image in python:3.12-slim python:3.12-alpine alpine:3.19 alpine:3.20 busybox:latest; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              mirror="m.daocloud.io/docker.io/library/$image"
              timeout 3m docker pull "$mirror"
              docker tag "$mirror" "$image"
            fi
          done

      - name: Restore or build verified native artifacts
        if: inputs.mode == 'source'
        working-directory: src/platform
        run: ci/native-cache/native-cache.sh restore-or-build

      - name: Validate platform tooling
        if: inputs.mode == 'source'
        working-directory: src/platform
        run: make test-release-tools test-perf-tools

      - name: Build and test source candidate
        if: inputs.mode == 'source'
        working-directory: src/platform
        run: |
          set -euo pipefail
          make build e2e-tools assemble-e2e
          make test-uffd-performance-gate

          owner="${CANDIDATE_REPOSITORY##*/}"
          runner="build/e2e-suite/test/e2e/$owner/run_all.sh"
          if [ "$owner" = platform ]; then
            runner=build/e2e-suite/test/e2e/run_all.sh
          fi
          [ -x "$runner" ] \
            || { echo "missing E2E runner for candidate owner $owner: $runner" >&2; exit 1; }

          ci/bms/ci-timed.sh "e2e/$owner" env \
            BIN="$PWD/bin/x86_64" \
            ZOT_BIN="$E2E_ZOT_BIN" \
            VGW_BIN="$E2E_VGW_BIN" \
            bash "$runner"

      - name: Run working-set performance smoke
        if: inputs.mode == 'source'
        working-directory: src/platform
        env:
          PERF_ITERS: "1"
          PERF_OUT_DIR: ${{ env.KUASAR_CI_DIR }}/working-set-perf
        run: |
          ci/bms/ci-timed.sh perf/working-set-smoke env \
            BIN="$PWD/bin/x86_64" \
            PERF_ITERS="$PERF_ITERS" \
            PERF_OUT_DIR="$PERF_OUT_DIR" \
            bash test/perf/sandbox-perf-working-set.sh

      - name: Test exact published assets from the platform package
        if: inputs.mode == 'exact-assets'
        working-directory: release-install
        env:
          BIN: ${{ github.workspace }}/release-install/bin
          ZOT_BIN: ${{ env.E2E_ZOT_BIN }}
          VGW_BIN: ${{ env.E2E_VGW_BIN }}
          REQUIRE_KVM: "1"
          REQUIRE_EXEC: "1"
          REQUIRE_CLUSTER_STUB: "1"
          REQUIRE_CLUSTER_REAL: "1"
          REQUIRE_ORCH: "1"
          REQUIRE_PROXY: "1"
          REQUIRE_BUILDER: "1"
          REQUIRE_RUNTASK: "1"
          REQUIRE_CONNECTOR_E2E: "1"
          REQUIRE_GUEST_RUNTIME: "1"
        run: bash test/e2e/run_all.sh

      - name: Upload revision and timing metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KUASAR_CI_DIR }}
          if-no-files-found: warn
          retention-days: 30
