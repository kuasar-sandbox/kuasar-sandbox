name: Daily Preview Coordinator
run-name: Daily preview convergence

on:
  schedule:
    - cron: "13 2-6 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      date:
        description: Optional YYYYMMDD version date; empty resumes the maintained preview or advances to today
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-preview-coordinator
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Check out preview controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release controller token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,kuasar-sandbox,orchestrator,sandboxer
          permission-actions: write
          permission-contents: read

      - name: Converge component and aggregate previews
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PLATFORM_TOKEN: ${{ github.token }}
          PREVIEW_POLL_SECONDS: "120"
          PREVIEW_WAIT_SECONDS: "3000"
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_DATE" ]; then
            release/preview-coordinator.sh "$REQUESTED_DATE"
          else
            release/preview-coordinator.sh
          fi
