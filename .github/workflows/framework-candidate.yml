name: Framework candidate

on:
  push:
    branches: ['ci/framework/pr-*/*']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: framework-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.event.repository.visibility == 'public' &&
      github.event.repository.full_name == github.repository &&
      github.repository == 'kuasar-sandbox/kuasar-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      number: ${{ steps.candidate.outputs.pull_request_number }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      base_ref: ${{ steps.candidate.outputs.base_ref }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the current exact platform merge candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ci/integration/framework_candidate.py

  ci:
    if: >-
      github.event.repository.visibility == 'public' &&
      github.event.repository.full_name == github.repository &&
      github.repository == 'kuasar-sandbox/kuasar-sandbox'
    needs: candidate
    uses: ./.github/workflows/integration-tests.yml
    with:
      mode: source
      candidate_repository: ${{ github.repository }}
      pull_request_number: ${{ needs.candidate.outputs.number }}
      candidate_sha: ${{ github.sha }}
      base_sha: ${{ needs.candidate.outputs.base_sha }}
      base_ref: ${{ needs.candidate.outputs.base_ref }}
      head_sha: ${{ needs.candidate.outputs.head_sha }}
