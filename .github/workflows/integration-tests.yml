name: Reusable Integration E2E

on:
  workflow_call:
    inputs:
      mode:
        description: source or exact-assets
        required: true
        type: string
      candidate_repository:
        description: Repository whose source candidate is under test
        required: false
        default: ""
        type: string
      pull_request_number:
        description: Pull request whose integration commit is under test
        required: false
        default: "0"
        type: string
      candidate_sha:
        description: Exact source integration commit
        required: false
        default: ""
        type: string
      base_sha:
        description: Integration commit first parent
        required: false
        default: ""
        type: string
      base_ref:
        description: Exact target branch of the pull request under test
        required: false
        default: ""
        type: string
      head_sha:
        description: Integration commit second parent
        required: false
        default: ""
        type: string
      companion_candidates:
        description: Resolved exact companion PR integration records for source mode
        required: false
        default: "[]"
        type: string
      release_version:
        description: Aggregate release-v* version for exact-assets mode
        required: false
        default: ""
        type: string
      release_bundle_artifact:
        description: Current-run artifact containing the exact aggregate bundle
        required: false
        default: ""
        type: string
      platform_source_sha:
        description: Exact platform selection source for exact-assets mode
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: integration-${{ inputs.mode }}-${{ inputs.candidate_repository || inputs.release_version }}-${{ inputs.candidate_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      framework_sha: ${{ steps.plan.outputs.framework_sha }}
      artifact: ${{ steps.plan.outputs.artifact }}
    env:
      INTEGRATION_MODE: ${{ inputs.mode }}
      CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
      CANDIDATE_PR: ${{ inputs.pull_request_number }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BASE_SHA: ${{ inputs.base_sha }}
      CANDIDATE_BASE_REF: ${{ inputs.base_ref }}
      CANDIDATE_HEAD_SHA: ${{ inputs.head_sha }}
      COMPANION_CANDIDATES: ${{ inputs.companion_candidates }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_BUNDLE_ARTIFACT: ${{ inputs.release_bundle_artifact }}
      PLATFORM_SOURCE_SHA: ${{ inputs.platform_source_sha }}
    steps:
      - name: Check out exact trusted framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ job.workflow_sha }}
          path: framework
          persist-credentials: false
      - name: Validate reusable workflow request
        env:
          TRUSTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: bash framework/ci/integration/validate-request.sh
      - name: Validate exact source admission
        if: inputs.mode == 'source'
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_TOKEN: ${{ github.token }}
        run: bash framework/ci/integration/validate-source-set.sh
      - name: Download staged aggregate
        if: inputs.mode == 'exact-assets'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_bundle_artifact }}
          path: aggregate-stage
      - name: Resolve exact immutable plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMEWORK_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          options=()
          if [ "$INTEGRATION_MODE" = exact-assets ]; then options+=(--stage aggregate-stage); fi
          python3 -B framework/ci/integration/resolve-artifacts.py \
            --framework-sha "$FRAMEWORK_SHA" --output plan.json "${options[@]}"
          {
            echo "framework_sha=$FRAMEWORK_SHA"
            echo "artifact=integration-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
      - name: Upload resolved plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: plan.json
          if-no-files-found: error
          retention-days: 7

  x86_64:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: resolve
    uses: ./.github/workflows/integration-architecture.yml
    with:
      arch: x86_64
      framework_sha: ${{ needs.resolve.outputs.framework_sha }}
      plan_artifact: ${{ needs.resolve.outputs.artifact }}
      stage_artifact: ${{ inputs.release_bundle_artifact }}

  aarch64:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: resolve
    uses: ./.github/workflows/integration-architecture.yml
    with:
      arch: aarch64
      framework_sha: ${{ needs.resolve.outputs.framework_sha }}
      plan_artifact: ${{ needs.resolve.outputs.artifact }}
      stage_artifact: ${{ inputs.release_bundle_artifact }}

  source-checks:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ needs.resolve.outputs.framework_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.artifact }}
          path: plan
      - name: Bootstrap required source checks
        run: bash framework/ci/hosted/bootstrap.sh --profile source
      - name: Run required source and UFFD checks
        run: |
          taskset -pc "$KUASAR_BUILD_CPUS" "$$" >/dev/null
          python3 -B framework/ci/integration/run-source-checks.py \
            --plan plan/plan.json --sources source-checks --output source-result.json
      - name: Upload source check result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-source-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-result.json
          if-no-files-found: error
          retention-days: 7

  results:
    if: always() && github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: [resolve, x86_64, aarch64, source-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every selected stage
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          X86_RESULT: ${{ needs.x86_64.result }}
          ARM_RESULT: ${{ needs.aarch64.result }}
          SOURCE_RESULT: ${{ needs.source-checks.result }}
        run: |
          [ "$RESOLVE_RESULT" = success ] && [ "$X86_RESULT" = success ] \
            && [ "$ARM_RESULT" = success ] && [ "$SOURCE_RESULT" = success ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/kuasar-sandbox
          ref: ${{ needs.resolve.outputs.framework_sha }}
          path: framework
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.artifact }}
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-architecture-result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: results
          merge-multiple: true
      - name: Bind both architecture results to the exact plan
        run: |
          python3 -B framework/ci/integration/artifacts.py results \
            --plan plan/plan.json --results results > validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation.json
            plan/plan.json
          if-no-files-found: error
          retention-days: 7
