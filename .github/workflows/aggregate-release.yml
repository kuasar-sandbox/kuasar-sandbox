name: Aggregate Release
run-name: Aggregate ${{ inputs.version }} @${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Aggregate version in release-vX.Y.Z or release-vX.Y.Z-preview.YYYYMMDD[.N] form
        required: true
        type: string
      source_ref:
        description: Exact main or release/vMAJOR.MINOR.x platform source branch
        required: true
        type: string
      source_sha:
        description: Exact source branch HEAD selected by the release controller
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: aggregate-mutation-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.request.outputs.artifact }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
      framework_sha: ${{ steps.framework.outputs.sha }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ job.workflow_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Record the exact trusted framework
        id: framework
        run: echo "sha=$(git -C control rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out exact platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Check environment GitHub CLI
        run: |
          gh --version
          gh_help="$(gh api --help)"
          [[ "$gh_help" == *--slurp* ]] || { echo "environment gh must support api --slurp" >&2; exit 1; }

      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Aggregate Release must run from project repository main" >&2; exit 1; }
          [[ "$SOURCE_REF" = main \
            || "$SOURCE_REF" =~ ^release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.x$ ]] \
            || { echo "source_ref must be main or release/vMAJOR.MINOR.x" >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_REF" \
            --jq 'select(.object.type == "commit") | .object.sha')" = "$SOURCE_SHA" ] \
            || { echo "$SOURCE_REF moved after selection" >&2; exit 1; }
          [ "$(git -C platform rev-parse HEAD)" = "$SOURCE_SHA" ]
          if [[ "$SOURCE_REF" =~ ^release/v([0-9]+)\.([0-9]+)\.x$ ]]; then
            [[ "$VERSION" =~ ^release-v${BASH_REMATCH[1]}\.${BASH_REMATCH[2]}\.[0-9]+(-preview\.[0-9]{8}(\.[1-9][0-9]*)?)?$ ]] \
              || { echo "$VERSION does not belong to $SOURCE_REF" >&2; exit 1; }
          fi
          bash control/release/validate-preview-line.sh "$VERSION" "$SOURCE_SHA"
          bash control/release/publish-release.sh check "$VERSION"
          manifest_commit=$(control/release/selection.py \
            "$GITHUB_WORKSPACE/platform" "$VERSION" --commit)
          [ "$manifest_commit" = "$SOURCE_SHA" ] \
            || { echo "$VERSION is not selected by $SOURCE_REF HEAD" >&2; exit 1; }
          control/release/selection.py "$GITHUB_WORKSPACE/platform" \
            "$VERSION" > selection.tsv
          {
            echo "version=$VERSION"
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$SOURCE_SHA"
            echo "artifact=aggregate-stage-${VERSION}-${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Create component release read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,orchestrator,sandboxer
          permission-contents: read

      - name: Fetch exact release assets and test sources
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          PLATFORM_SOURCE_ROOT: ${{ github.workspace }}/platform
          SOURCE_DATE_EPOCH: ${{ github.event.repository.updated_at }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git -C "$PLATFORM_SOURCE_ROOT" show -s --format=%ct \
            "${{ steps.request.outputs.source_sha }}")
          export SOURCE_DATE_EPOCH
          control/release/aggregate-release.sh fetch "$VERSION" fetched
      - name: Select the admitted native Workbench images once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B control/ci/hosted/workbench.py select \
            --framework-sha "${{ steps.framework.outputs.sha }}" --output workbench.json
      - name: Transport the exact fetched inputs
        run: tar -cf fetched.tar fetched
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aggregate-sources-${{ github.run_id }}
          path: |
            fetched.tar
            workbench.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  helper-build:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.framework_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: helper-work/platform
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aggregate-sources-${{ github.run_id }}
          path: transport
      - name: Materialize exact helper inputs without running a compiler
        run: |
          python3 -B control/ci/integration/transport.py extract transport/fetched.tar inputs
          python3 -B - <<'PY'
          import importlib, json, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path('control/ci/integration').resolve()))
          build = importlib.import_module('build-artifacts')
          pins = json.loads(pathlib.Path('inputs/fetched/test-revisions.json').read_text())
          platform_sha = subprocess.check_output(
              ['git', '-C', 'helper-work/platform', 'rev-parse', 'HEAD'], text=True).strip()
          records = build.artifacts.release_test_revisions(pins, platform_sha)
          for owner, record in sorted(records.items()):
              if owner != 'platform':
                  build.checkout(record['repository'], record['sha'], pathlib.Path('helper-work') / owner)
          PY
          mkdir helper-work/.ci
          cp inputs/fetched/test-revisions.json helper-work/.ci/
      - name: Build native immutable E2E helpers in Workbench
        uses: ./control/.github/actions/workbench
        with:
          selection: transport/workbench.json
          sources: helper-work
          cache-coverage: aggregate-helpers
          outputs: |
            .ci/e2e-helpers
            .ci/e2e-wheels
          arch: ${{ matrix.arch }}
          cpus: '2'
          memory-gib: '8'
          run: |
            python3 -B /inputs/release/release/build-e2e-helpers.py \
              --sources /src --test-revisions /src/.ci/test-revisions.json --arch "$TARGET_ARCH" \
              --output /src/.ci/e2e-helpers --wheels-output /src/.ci/e2e-wheels --platform-source /src/platform
      - name: Transport this native helper package
        run: tar -cf "helpers-${{ matrix.arch }}.tar" -C helper-work/.ci e2e-helpers e2e-wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aggregate-helpers-${{ matrix.arch }}-${{ github.run_id }}
          path: helpers-${{ matrix.arch }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  collect:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: [prepare, helper-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.framework_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: platform
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aggregate-sources-${{ github.run_id }}
          path: transport
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aggregate-helpers-*-${{ github.run_id }}
          path: helpers
          merge-multiple: true
      - name: Combine the two exact native helper packages
        run: |
          python3 -B control/ci/integration/transport.py extract transport/fetched.tar inputs
          mv inputs/fetched fetched
          mkdir -p fetched/e2e-helpers fetched/e2e-wheels
          for arch in x86_64 aarch64; do
            python3 -B control/ci/integration/transport.py extract "helpers/helpers-$arch.tar" "helpers/$arch"
            mv "helpers/$arch/e2e-helpers/$arch" fetched/e2e-helpers/
            mv "helpers/$arch/e2e-wheels/$arch" fetched/e2e-wheels/
          done
      - name: Collect the shared external inputs once for both native images
        env:
          PLATFORM_SOURCE_ROOT: ${{ github.workspace }}/platform
          VERSION: ${{ needs.prepare.outputs.version }}
          E2E_HELPER_ROOT: ${{ github.workspace }}/fetched/e2e-helpers
          E2E_WHEEL_ROOT: ${{ github.workspace }}/fetched/e2e-wheels
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          export SOURCE_DATE_EPOCH=$(git -C platform show -s --format=%ct HEAD)
          control/release/package-platform.sh package "$VERSION" fetched/sources fetched/test-sources platform-input
          mkdir collected-platform
          tar -xzf "platform-input/assets/platform-$VERSION.tar.gz" -C collected-platform
          python3 -B platform/workbench/collect-inputs.py --cases collected-platform/test/e2e/cases \
            --arch x86_64 --arch aarch64 --output collected-inputs
          tar -cf workbench-inputs.tar collected-inputs collected-platform/test/e2e/cases
          tar -cf fetched.tar fetched
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-inputs-${{ github.run_id }}
          path: workbench-inputs.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aggregate-inputs-${{ github.run_id }}
          path: fetched.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  workbench-build:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: [prepare, collect]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: platform
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workbench-inputs-${{ github.run_id }}
          path: transport
      - name: Build and save the native aggregate image without publication credentials
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 -B platform/ci/integration/transport.py extract transport/workbench-inputs.tar inputs
          python3 -B platform/workbench/build.py --version "$VERSION" --arch "$TARGET_ARCH" \
            --cases inputs/collected-platform/test/e2e/cases --deps-dir inputs/collected-inputs \
            --output image --cpus 2 --memory-gib 6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-image-${{ matrix.arch }}-${{ github.run_id }}
          path: image/workbench-*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  stage:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: [prepare, workbench-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ job.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: platform
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aggregate-inputs-${{ github.run_id }}
          path: transport
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: workbench-image-*-${{ github.run_id }}
          path: workbench-images
          merge-multiple: true
      - name: Assemble the complete declared set without repackaging products
        env:
          PLATFORM_SOURCE_ROOT: ${{ github.workspace }}/platform
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 -B control/ci/integration/transport.py extract transport/fetched.tar inputs
          mv workbench-images inputs/fetched/workbench
          export SOURCE_DATE_EPOCH=$(git -C platform show -s --format=%ct HEAD)
          control/release/aggregate-release.sh assemble "$VERSION" inputs/fetched aggregate-stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: aggregate-stage
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release-asset-validation:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: [prepare, stage]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/integration-tests.yml
    with:
      mode: exact-assets
      release_version: ${{ needs.prepare.outputs.version }}
      release_bundle_artifact: ${{ needs.prepare.outputs.artifact }}
      platform_source_sha: ${{ needs.prepare.outputs.source_sha }}
      workbench_selection_artifact: aggregate-sources-${{ github.run_id }}

  publish:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: [prepare, release-asset-validation]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out exact published platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Check environment GitHub CLI
        run: |
          gh --version
          gh_help="$(gh api --help)"
          [[ "$gh_help" == *--slurp* ]] || { echo "environment gh must support api --slurp" >&2; exit 1; }

      - name: Download validated aggregate stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: aggregate-stage

      - name: Download exact profile validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-validation-${{ github.run_id }}
          path: validated

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-workbench-result-*-${{ github.run_id }}
          path: workbench-results
          merge-multiple: true
      - name: Bind publication to the tested bytes
        run: python3 -B release/bind-validation.py aggregate-stage validated/plan/plan.json validated/validation.json --workbench workbench-results

      - name: Install registry transfer tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo

      - name: Publish aggregate release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PLATFORM_SOURCE_ROOT: ${{ github.workspace }}/platform
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_REF" \
            --jq 'select(.object.type == "commit") | .object.sha')" = "$SOURCE_SHA" ] \
            || { echo "$SOURCE_REF moved while release asset validation was running" >&2; exit 1; }
          bash release/validate-preview-line.sh "$VERSION" "$SOURCE_SHA"
          release/publish-release.sh publish \
            "$VERSION" "$SOURCE_SHA" aggregate-stage "$SOURCE_REF"

  cleanup:
    if: github.event.repository.visibility == 'public' && github.event.repository.full_name == github.repository
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete release workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id_lines=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | test("^(aggregate-stage-|aggregate-inputs-|aggregate-sources-|aggregate-helpers-|workbench-inputs-|workbench-image-|integration-build-|integration-readers-|integration-prepared-)")) | .id')
          artifact_ids=()
          if [[ -n "$artifact_id_lines" ]]; then
            mapfile -t artifact_ids <<< "$artifact_id_lines"
          fi
          for artifact_id in "${artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --silent
          done
          echo "deleted ${#artifact_ids[@]} release workflow artifact(s)"
