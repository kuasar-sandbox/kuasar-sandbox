name: Aggregate Release
run-name: Aggregate ${{ inputs.version }} @${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Aggregate version in release-vX.Y.Z or release-vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string
      source_ref:
        description: Exact main or release/vMAJOR.MINOR.x platform source branch
        required: true
        type: string
      source_sha:
        description: Exact source branch HEAD selected by the release controller
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: aggregate-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.request.outputs.artifact }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned GitHub CLI
        run: bash control/release/install-gh-cli.sh

      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Aggregate Release must run from project repository main" >&2; exit 1; }
          [[ "$SOURCE_REF" = main \
            || "$SOURCE_REF" =~ ^release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.x$ ]] \
            || { echo "source_ref must be main or release/vMAJOR.MINOR.x" >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_REF" \
            --jq 'select(.object.type == "commit") | .object.sha')" = "$SOURCE_SHA" ] \
            || { echo "$SOURCE_REF moved after selection" >&2; exit 1; }
          [ "$(git -C platform rev-parse HEAD)" = "$SOURCE_SHA" ]
          if [[ "$SOURCE_REF" =~ ^release/v([0-9]+)\.([0-9]+)\.x$ ]]; then
            [[ "$VERSION" =~ ^release-v${BASH_REMATCH[1]}\.${BASH_REMATCH[2]}\.[0-9]+(-preview\.[0-9]{8})?$ ]] \
              || { echo "$VERSION does not belong to $SOURCE_REF" >&2; exit 1; }
          fi
          bash control/release/validate-preview-line.sh "$VERSION" "$SOURCE_SHA"
          bash control/release/publish-release.sh check "$VERSION"
          control/release/selection.py "$GITHUB_WORKSPACE/platform" \
            "$VERSION" > selection.tsv
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact=aggregate-stage-${VERSION}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Create component release read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,guest-runtime,orchestrator,sandboxer
          permission-contents: read

      - name: Fetch and assemble exact release assets
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          PLATFORM_SOURCE_ROOT: ${{ github.workspace }}/platform
          SOURCE_DATE_EPOCH: ${{ github.event.repository.updated_at }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git -C "$PLATFORM_SOURCE_ROOT" show -s --format=%ct \
            "${{ steps.request.outputs.source_sha }}")
          export SOURCE_DATE_EPOCH
          control/release/aggregate-release.sh fetch "$VERSION" fetched
          control/release/aggregate-release.sh assemble \
            "$VERSION" fetched aggregate-stage

      - name: Upload exact aggregate stage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.request.outputs.artifact }}
          path: aggregate-stage
          if-no-files-found: error
          retention-days: 1

  exact-asset-bms:
    needs: prepare
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/bms-e2e.yml
    with:
      mode: exact-assets
      release_version: ${{ needs.prepare.outputs.version }}
      release_bundle_artifact: ${{ needs.prepare.outputs.artifact }}
      platform_source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets:
      KUASAR_CI_APP_PRIVATE_KEY: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}

  publish:
    needs: [prepare, exact-asset-bms]
    runs-on: ubuntu-latest
    concurrency:
      group: aggregate-publish-${{ github.repository }}-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out exact published platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned GitHub CLI
        run: bash release/install-gh-cli.sh

      - name: Download BMS-validated aggregate stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: aggregate-stage

      - name: Publish aggregate release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PLATFORM_SOURCE_ROOT: ${{ github.workspace }}/platform
        run: |
          set -euo pipefail
          bash release/validate-preview-line.sh "$VERSION" "$SOURCE_SHA"
          release/publish-release.sh publish \
            "$VERSION" "$SOURCE_SHA" aggregate-stage "$SOURCE_REF"

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete release workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id_lines=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].id')
          artifact_ids=()
          if [[ -n "$artifact_id_lines" ]]; then
            mapfile -t artifact_ids <<< "$artifact_id_lines"
          fi
          for artifact_id in "${artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --silent
          done
          echo "deleted ${#artifact_ids[@]} release workflow artifact(s)"
